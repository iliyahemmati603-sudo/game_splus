<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Nexus Arcade</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="boot"><div class="boot-mark">NEXUS</div><div class="boot-bar"><span></span></div></div>

<div id="app">
<div id="screen-home" class="screen active">
  <header class="bar">
    <button class="profile" data-nav="profile">
      <span class="ava" data-bind="avatar">?</span>
      <span class="meta"><b data-bind="name">بازیکن</b><i>آنلاین</i></span>
    </button>
    <div class="bar-actions">
      <button class="chip" data-action="toggle-theme"><span data-bind="theme-icon">☾</span></button>
      <button class="chip gold" data-nav="profile">◆ <span data-bind="coins">0</span></button>
    </div>
  </header>
  <div class="hero"><h1>NEXUS ARCADE</h1><p>بازی، تمرکز، رقابت</p></div>
  <div class="cats" data-bind="categories"></div>
  <div class="title-row"><h2 data-bind="section-title">همه بازی‌ها</h2></div>
  <div class="list" data-bind="games"></div>
  <nav class="nav">
    <button data-nav="home" class="on">خانه</button>
    <button data-nav="leaderboard">رتبه‌بندی</button>
    <button data-nav="profile">پروفایل</button>
    <button data-nav="settings">تنظیمات</button>
    <button data-nav="about">درباره</button>
  </nav>
</div>

<div id="screen-leaderboard" class="screen">
  <header class="bar"><button class="back" data-nav="home">→</button><h3>رتبه‌بندی</h3><span></span></header>
  <div class="cats" data-bind="lb-filters"></div>
  <div class="list" data-bind="lb-list"></div>
</div>

<div id="screen-profile" class="screen">
  <header class="bar"><button class="back" data-nav="home">→</button><h3>پروفایل</h3><span></span></header>
  <div class="card center">
    <span class="ava big" data-bind="avatar">?</span>
    <h3 data-bind="name">بازیکن</h3>
    <div class="stats">
      <div><b data-bind="games-count">0</b><i>بازی</i></div>
      <div><b data-bind="best">0</b><i>رکورد</i></div>
      <div><b data-bind="coins">0</b><i>سکه</i></div>
    </div>
  </div>
  <div class="card">
    <h4>نام نمایشی</h4>
    <input type="text" id="username-field" maxlength="15">
    <button class="btn" data-action="save-name">ذخیره</button>
  </div>
  <div class="card"><h4>رکوردها</h4><div data-bind="profile-records"></div></div>
</div>

<div id="screen-settings" class="screen">
  <header class="bar"><button class="back" data-nav="home">→</button><h3>تنظیمات</h3><span></span></header>
  <div class="card">
    <div class="row"><span>صدا</span><button class="switch" data-toggle="sound"></button></div>
    <div class="row"><span>لرزش</span><button class="switch" data-toggle="haptics"></button></div>
  </div>
  <div class="card"><button class="btn danger" data-action="reset">حذف داده‌ها</button></div>
</div>

<div id="screen-about" class="screen">
  <header class="bar"><button class="back" data-nav="home">→</button><h3>درباره ما</h3><span></span></header>
  <div class="card"><h3>Nexus Arcade</h3><p>مجموعه‌ای از بازی‌های سبک، سریع و رقابتی.</p></div>
  <div class="card">
    <h4>توسعه</h4>
    <a href="https://splus.ir/none313" target="_blank">@none313</a>
    <h4 style="margin-top:14px">مدیریت</h4>
    <a href="https://splus.ir/fiioz" target="_blank">@fiioz</a>
  </div>
</div>

<div id="screen-lobby" class="screen">
  <header class="bar"><button class="back" data-nav="home">→</button><h3 data-bind="lobby-title">بازی</h3><span></span></header>
  <div class="card center">
    <div class="lobby-icon" data-bind="lobby-icon">🎮</div>
    <h2 data-bind="lobby-name">بازی</h2>
    <p data-bind="lobby-desc"></p>
  </div>
  <div class="card actions">
    <button class="btn primary" data-action="play">شروع بازی</button>
    <button class="btn" data-action="about-game">درباره و نحوه بازی</button>
    <button class="btn" data-action="game-lb">جدول امتیازات</button>
    <button class="btn ghost" data-nav="home">بازگشت</button>
  </div>
  <div class="card" data-bind="lobby-extra"></div>
</div>

<div id="screen-play" class="screen no-nav">
  <header class="bar"><button class="back" data-action="quit">→</button><h3 data-bind="play-title">بازی</h3><span></span></header>
  <canvas id="game-canvas"></canvas>
  <div class="hud" data-bind="hud"></div>
  <div class="overlay" data-bind="game-overlay"></div>
  <div class="dpad" data-bind="dpad" hidden>
    <button data-dir="up">▲</button>
    <div><button data-dir="left">◀</button><button data-dir="down">▼</button><button data-dir="right">▶</button></div>
  </div>
</div>
</div>

<div id="toast" data-bind="toast"></div>
<script src="firebase-config.js"></script>
<script src="boot.js" type="module"></script>
</body>
</html>
