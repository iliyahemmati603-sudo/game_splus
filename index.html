<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Galactic Arcade</title>
<script src="https://telegram.org/js/telegram-web-app.js" defer></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="toast-container"></div>

<header class="header">
    <div class="user-profile">
        <div class="avatar" id="ui-avatar">G</div>
        <div class="user-details">
            <h2 id="ui-name">کاوشگر</h2>
            <p id="ui-tag">Galactic Pro</p>
        </div>
    </div>
    <div class="wallet">
        <span>💎</span><span id="ui-coins">0</span>
    </div>
</header>

<main class="main-content">
    <section id="tab-home" class="tab-pane active">
        <div class="hero-section">
            <h1 class="hero-title">به Galactic Arcade خوش آمدید</h1>
            <p class="hero-desc">بیش از ۱۲ بازی حرفه‌ای، رقابت با بازیکنان دیگر، و کسب سکه‌های ارزشمند در انتظار شماست.</p>
        </div>
        <div class="section-title">پیشنهاد ویژه</div>
        <div class="game-grid">
            <div class="game-card featured" onclick="GameManager.open('lumberjack')">
                <div class="game-icon">🪓</div>
                <div class="game-title">چوب‌بر</div>
                <div class="game-desc">با سرعت درخت‌ها را قطع کن</div>
            </div>
            <div class="game-card featured" onclick="GameManager.open('rocket')">
                <div class="game-icon">🚀</div>
                <div class="game-title">سفر موشک</div>
                <div class="game-desc">از سیارک‌ها فرار کن</div>
            </div>
        </div>
    </section>

    <section id="tab-games" class="tab-pane">
        <div class="section-title">کتابخانه بازی‌ها</div>
        <div class="game-grid" id="games-list"></div>
    </section>

    <section id="tab-leaderboard" class="tab-pane">
        <div class="section-title">برترین‌های جهان</div>
        <div id="leaderboard-list"></div>
    </section>

    <section id="tab-profile" class="tab-pane">
        <div class="section-title">پروفایل شما</div>
        <div class="profile-card">
            <div class="profile-header">
                <div class="avatar large" id="prof-avatar">G</div>
                <h3 id="prof-name">کاربر</h3>
            </div>
            <div class="profile-stats">
                <div class="stat-item">
                    <div class="stat-value" id="prof-coins">0</div>
                    <div class="stat-label">سکه</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="prof-games">0</div>
                    <div class="stat-label">بازی</div>
                </div>
            </div>
        </div>
    </section>
</main>

<nav class="bottom-nav">
    <button class="nav-btn active" onclick="UIManager.switchTab('home', this)">
        <span class="nav-icon">🏠</span><span>خانه</span>
    </button>
    <button class="nav-btn" onclick="UIManager.switchTab('games', this)">
        <span class="nav-icon">🎮</span><span>بازی‌ها</span>
    </button>
    <button class="nav-btn" onclick="UIManager.switchTab('leaderboard', this)">
        <span class="nav-icon">🏆</span><span>رتبه</span>
    </button>
    <button class="nav-btn" onclick="UIManager.switchTab('profile', this)">
        <span class="nav-icon">👤</span><span>پروفایل</span>
    </button>
</nav>

<div class="modal-overlay" id="game-modal">
    <div class="modal-content" id="modal-box">
        <button class="btn-close" onclick="GameManager.close()">×</button>
        <h2 class="modal-title" id="m-title"></h2>
        <p class="modal-desc" id="m-desc"></p>
        <div class="game-container" id="m-content"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
