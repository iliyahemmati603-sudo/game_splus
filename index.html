<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#060912">
<title>NEXUS ARCADE PRO</title>
<style>
:root{--bg:#060912;--bg2:#0b1222;--card:#101a2e;--cyan:#00e5ff;--pink:#ff2d78;--gold:#ffc531;--green:#2bff88;--purple:#a855f7;--text:#e8f4ff;--muted:#5f7a99;--border:rgba(0,229,255,.16);--accent:#00e5ff;--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Tahoma,system-ui,sans-serif;touch-action:none;position:fixed;overscroll-behavior:none}
#menu{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;padding:14px 12px calc(22px + var(--sb));overflow-y:auto;background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(0,229,255,.14),transparent 60%),radial-gradient(ellipse 70% 50% at 50% 110%,rgba(168,85,247,.1),transparent 60%),var(--bg)}
#menu::-webkit-scrollbar{width:0}
.brand{text-align:center;margin:2px 0 12px}
.brand h1{font-size:clamp(22px,6.5vw,38px);font-weight:900;letter-spacing:1.5px;background:linear-gradient(90deg,var(--cyan),#7dd3fc,var(--purple),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(0,229,255,.4));line-height:1.2}
.brand p{margin-top:3px;font-size:10px;color:var(--muted)}
.topbar{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:10px;width:100%;max-width:900px}
.uchip{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:999px;padding:4px 10px 4px 4px;cursor:pointer}
.av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--purple));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#031018;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.uname{font-size:11px;font-weight:700;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{background:rgba(255,255,255,.035);border:1px solid var(--border);border-radius:999px;padding:4px 11px;font-size:10px;color:var(--muted);display:flex;align-items:center;gap:4px;cursor:pointer}
.chip b{color:var(--text);font-size:11px}
.stats{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:900px;padding-bottom:20px}
@media(min-width:560px){.grid{grid-template-columns:repeat(4,1fr);gap:10px}}
@media(min-width:860px){.grid{grid-template-columns:repeat(5,1fr)}}
.card{background:linear-gradient(160deg,#131f36,#0a0f1c);border:1px solid var(--border);border-radius:14px;padding:11px 5px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;position:relative;overflow:hidden;min-height:88px;justify-content:center}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.7}
.card:active{transform:scale(.93);border-color:var(--cyan)}
.card .ic{font-size:23px}
.card .nm{font-size:10px;font-weight:700;text-align:center;line-height:1.2}
.card .ds{font-size:8px;color:var(--muted);text-align:center}
.card .bs{font-size:8px;color:var(--gold)}
#game{position:absolute;inset:0;z-index:10;display:none}
#game.on{display:block}
#cv{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;top:0;left:0;right:0;padding:calc(5px + var(--st)) 7px 5px;display:flex;gap:4px;flex-wrap:wrap;justify-content:center;pointer-events:none;z-index:12}
.pill{background:rgba(6,10,20,.8);border:1px solid rgba(0,229,255,.24);border-radius:999px;padding:3px 10px;font-size:10px;color:#bfe9ff;white-space:nowrap;display:flex;align-items:center;gap:3px}
.pill b{color:#fff;font-size:11px}
#back{position:absolute;top:calc(7px + var(--st));right:7px;z-index:30;width:36px;height:36px;border-radius:50%;border:1px solid rgba(0,229,255,.3);background:rgba(5,8,16,.82);color:var(--cyan);font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#console-btn{position:absolute;top:calc(7px + var(--st));right:52px;z-index:30;width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,197,49,.4);background:rgba(5,8,16,.82);color:var(--gold);font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#console-panel{position:absolute;top:calc(50px + var(--st));right:7px;left:7px;z-index:35;max-height:45vh;background:rgba(2,4,8,.96);border:1px solid rgba(255,197,49,.3);border-radius:12px;display:none;flex-direction:column;overflow:hidden}
#console-panel.show{display:flex}
#console-header{padding:6px 10px;background:rgba(255,197,49,.1);border-bottom:1px solid rgba(255,197,49,.2);display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--gold)}
#console-body{padding:6px 8px;overflow-y:auto;font-family:monospace;font-size:9px;line-height:1.5;direction:ltr;text-align:left;max-height:38vh}
#console-body::-webkit-scrollbar{width:3px}
#console-body::-webkit-scrollbar-thumb{background:var(--gold);border-radius:2px}
.log-line{padding:1px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.log-error{color:#ff2d78}
.log-warn{color:#ffc531}
.log-info{color:#00e5ff}
.log-log{color:#7a8fa6}
#over{position:absolute;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:20px;background:rgba(2,4,8,.94);text-align:center}
#over.show{display:flex}
#over .bd{font-size:8px;letter-spacing:3px;color:var(--muted)}
#over h2{font-size:clamp(20px,5.5vw,30px);font-weight:900;color:var(--pink);text-shadow:0 0 22px rgba(255,45,120,.5)}
#over .sc{font-size:26px;font-weight:900;color:var(--gold)}
#over .sb{font-size:11px;color:var(--muted);line-height:1.6}
#over .sb b{color:var(--text)}
.acts{display:flex;flex-direction:column;gap:7px;width:100%;max-width:250px}
.btn{width:100%;padding:11px 16px;border-radius:11px;border:none;font-size:13px;font-weight:800;font-family:inherit;cursor:pointer;background:linear-gradient(135deg,#00e5ff,#0090d0);color:#031018}
.btn.g{background:transparent;border:1px solid rgba(0,229,255,.3);color:var(--cyan);font-size:12px}
#modal{position:absolute;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.65);padding:0}
#modal.show{display:flex}
.sheet{background:linear-gradient(180deg,#0d1628,#080d18);border-radius:22px 22px 0 0;border-top:1px solid rgba(0,229,255,.2);width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding:18px 16px calc(16px + var(--sb));animation:su .22s ease;position:relative}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet::-webkit-scrollbar{width:0}
.sheet h3{font-size:16px;font-weight:900;margin-bottom:12px;color:var(--cyan);text-align:center}
.sheet label{display:block;font-size:11px;color:var(--muted);margin:10px 0 4px}
.sheet input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:#fff;font-size:13px;font-family:inherit;outline:none}
.tgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:6px}
.tsw{aspect-ratio:1;border-radius:10px;border:2px solid transparent;cursor:pointer}
.tsw.on{border-color:#fff;box-shadow:0 0 12px rgba(255,255,255,.4)}
.lb-row{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.025);margin-bottom:5px;border:1px solid transparent}
.lb-row.me{border-color:rgba(0,229,255,.3);background:rgba(0,229,255,.06)}
.lb-rank{font-size:13px;font-weight:900;width:26px;text-align:center;color:var(--muted)}
.lb-rank.t1{color:var(--gold)}.lb-rank.t2{color:#c0c8d4}.lb-rank.t3{color:#cd7f32}
.lb-av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--purple));display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#031018;overflow:hidden;flex-shrink:0}
.lb-av img{width:100%;height:100%;object-fit:cover}
.lb-info{flex:1;min-width:0}
.lb-name{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-sub{font-size:9px;color:var(--muted)}
.lb-sc{font-size:13px;font-weight:900;color:var(--gold)}
.close-x{position:absolute;top:10px;left:12px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.06);border:none;color:var(--muted);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.ft{margin-top:2px;font-size:8px;color:#33445a;letter-spacing:.5px;text-align:center}
.dpad{position:absolute;bottom:calc(16px + var(--sb));left:50%;transform:translateX(-50%);z-index:25;display:none;grid-template-columns:repeat(3,48px);grid-template-rows:repeat(3,48px);gap:4px;pointer-events:none}
.dpad.on{display:grid}
.dpad button{pointer-events:auto;width:48px;height:48px;border-radius:12px;border:1px solid rgba(0,229,255,.3);background:rgba(6,12,24,.78);color:var(--cyan);font-size:17px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.dpad button:active{background:rgba(0,229,255,.2);transform:scale(.9)}
.dpad .up{grid-column:2;grid-row:1}.dpad .left{grid-column:1;grid-row:2}.dpad .right{grid-column:3;grid-row:2}.dpad .down{grid-column:2;grid-row:3}
</style>
</head>
<body>
<div id="menu">
<div class="brand"><h1>NEXUS ARCADE</h1><p>۲۱ مینی‌گیم حرفه‌ای · Telegram Ready</p></div>

<script>
'use strict';

const Console = {
  logs: [],
  max: 120,
  init() {
    const origLog = console.log, origWarn = console.warn, origError = console.error;
    const self = this;
    console.log = function(...a) { origLog.apply(console, a); self.push('log', a.join(' ')); };
    console.warn = function(...a) { origWarn.apply(console, a); self.push('warn', a.join(' ')); };
    console.error = function(...a) { origError.apply(console, a); self.push('error', a.join(' ')); };
    window.addEventListener('error', e => self.push('error', `${e.message} @ ${e.filename}:${e.lineno}:${e.colno}`));
    window.addEventListener('unhandledrejection', e => self.push('error', `Promise: ${e.reason}`));
  },
  push(type, msg) {
    this.logs.push({ type, msg, t: new Date().toLocaleTimeString() });
    if (this.logs.length > this.max) this.logs.shift();
    this.render();
  },
  render() {
    const body = document.getElementById('console-body');
    if (!body) return;
    body.innerHTML = this.logs.slice(-80).map(l =>
      `<div class="log-line log-${l.type}">[${l.t}] ${l.msg.replace(/</g,'&lt;')}</div>`
    ).join('');
    body.scrollTop = body.scrollHeight;
  },
  clear() { this.logs = []; this.render(); }
};
Console.init();

function toggleConsole() {
  document.getElementById('console-panel').classList.toggle('show');
}
function clearConsole() { Console.clear(); }

const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t,rand=(a,b)=>a+Math.random()*(b-a),randInt=(a,b)=>Math.floor(rand(a,b+1)),TAU=Math.PI*2,nw=()=>performance.now();

const DB={
  key:'nx_pro_v1', data:null,
  load(){
    try{this.data=JSON.parse(localStorage.getItem(this.key)||'{}');}catch(e){this.data={};}
    this.data.profile=this.data.profile||{name:'بازیکن',avatar:'',id:'g_'+Math.random().toString(36).slice(2,9)};
    this.data.best=this.data.best||{};
    this.data.plays=this.data.plays||0;
    this.data.theme=this.data.theme||0;
    this.data.leaderboard=this.data.leaderboard||[];
    this.data.settings=this.data.settings||{sound:true,haptics:true};
  },
  save(){try{localStorage.setItem(this.key,JSON.stringify(this.data));}catch(e){}},
  get(k,d){return this.data[k]!==undefined?this.data[k]:d;},
  set(k,v){this.data[k]=v;this.save();}
};
DB.load();

const THEMES=[
  {name:'نئون',bg:'#060912',bg2:'#0b1222',cyan:'#00e5ff',pink:'#ff2d78',gold:'#ffc531',green:'#2bff88',purple:'#a855f7',text:'#e8f4ff',muted:'#5f7a99',border:'rgba(0,229,255,.16)'},
  {name:'نیمه‌شب',bg:'#0a0e1a',bg2:'#141c30',cyan:'#5eb8ff',pink:'#ff6b9d',gold:'#ffd166',green:'#6bffb8',purple:'#c084fc',text:'#eef2ff',muted:'#6b7fa8',border:'rgba(94,184,255,.18)'},
  {name:'غروب',bg:'#12080a',bg2:'#1f0f12',cyan:'#ff8a65',pink:'#ff5252',gold:'#ffca28',green:'#aed581',purple:'#ba68c8',text:'#fff3e0',muted:'#8d6e63',border:'rgba(255,138,101,.2)'},
  {name:'جنگل',bg:'#06120a',bg2:'#0b1f12',cyan:'#4ade80',pink:'#f472b6',gold:'#fbbf24',green:'#34d399',purple:'#a78bfa',text:'#ecfdf5',muted:'#4b7a5e',border:'rgba(74,222,128,.18)'},
  {name:'اقیانوس',bg:'#020c1a',bg2:'#04162e',cyan:'#38bdf8',pink:'#fb7185',gold:'#fbbf24',green:'#2dd4bf',purple:'#818cf8',text:'#e0f2fe',muted:'#3a6a8a',border:'rgba(56,189,248,.18)'}
];

function applyTheme(i){
  const t=THEMES[i]||THEMES[0];
  const r=document.documentElement.style;
  r.setProperty('--bg',t.bg);r.setProperty('--bg2',t.bg2);r.setProperty('--cyan',t.cyan);r.setProperty('--pink',t.pink);
  r.setProperty('--gold',t.gold);r.setProperty('--green',t.green);r.setProperty('--purple',t.purple);
  r.setProperty('--text',t.text);r.setProperty('--muted',t.muted);r.setProperty('--border',t.border);
  DB.set('theme',i);
}

const Snd={
  ctx:null,
  e(){if(!this.ctx){const A=window.AudioContext||window.webkitAudioContext;if(A)this.ctx=new A();}if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();return this.ctx;},
  t(f,d=0.08,tp='sine',v=0.1,ef=null){
    if(!DB.get('settings').sound)return;
    const c=this.e();if(!c)return;
    try{
      const t=c.currentTime,o=c.createOscillator(),g=c.createGain();
      o.type=tp;o.frequency.setValueAtTime(Math.max(30,f),t);
      if(ef)o.frequency.exponentialRampToValueAtTime(Math.max(30,ef),t+d);
      g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
      o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+d);
    }catch(e){}
  },
  jump(){this.t(380,0.12,'sine',0.1,760)},
  coin(){this.t(980,0.06,'sine',0.1,1400)},
  hit(){this.t(190,0.15,'sawtooth',0.12,55)},
  win(){this.t(620,0.08,'sine',0.1,900);setTimeout(()=>this.t(920,0.13,'sine',0.1,1240),85)},
  lose(){this.t(280,0.28,'sawtooth',0.1,75)},
  ui(){this.t(680,0.035,'sine',0.055)},
  chop(){this.t(320,0.05,'square',0.08,180)}
};

const Hap={
  ok(){if(DB.get('settings').haptics&&navigator.vibrate)navigator.vibrate(12)},
  med(){if(DB.get('settings').haptics&&navigator.vibrate)navigator.vibrate(26)},
  heavy(){if(DB.get('settings').haptics&&navigator.vibrate)navigator.vibrate([32,22,50])},
  success(){if(DB.get('settings').haptics&&navigator.vibrate)navigator.vibrate([14,30,14])}
};

const Par={
  pool:[],
  init(n=700){this.pool=new Array(n);for(let i=0;i<n;i++)this.pool[i]={on:false,x:0,y:0,vx:0,vy:0,life:0,max:1,color:'#fff',size:2,grav:0};},
  spawn(x,y,c,o={}){
    const{color='#00e5ff',minSpeed=60,maxSpeed=220,gravity=200,minSize=1,maxSize=4,angle=null,spread=TAU}=o;
    let n=0;
    for(let i=0;i<this.pool.length&&n<c;i++){
      const p=this.pool[i];if(p.on)continue;
      const a=angle!==null?angle+rand(-spread/2,spread/2):rand(0,TAU),sp=rand(minSpeed,maxSpeed);
      p.on=true;p.x=x;p.y=y;p.vx=Math.cos(a)*sp;p.vy=Math.sin(a)*sp;p.life=p.max=rand(0.3,0.8);
      p.color=color;p.size=rand(minSize,maxSize);p.grav=gravity;n++;
    }
  },
  update(dt){for(let i=0;i<this.pool.length;i++){const p=this.pool[i];if(!p.on)continue;p.life-=dt;if(p.life<=0){p.on=false;continue;}p.vy+=p.grav*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;}},
  render(ctx){for(let i=0;i<this.pool.length;i++){const p=this.pool[i];if(!p.on)continue;ctx.globalAlpha=p.life/p.max;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,TAU);ctx.fill();}ctx.globalAlpha=1;}
};

const Cam={
  shake:0,
  add(v){this.shake=Math.min(2,this.shake+v)},
  update(dt){if(this.shake>0)this.shake=Math.max(0,this.shake-dt*3.5)},
  apply(ctx){if(this.shake>0.01){const s=this.shake*8;ctx.translate(rand(-s,s),rand(-s,s))}}
};

const LB={
  list:DB.get('leaderboard',[]),
  submit(g,s){
    const p=DB.get('profile');
    this.list.push({name:p.name,avatar:p.avatar,id:p.id,game:g,score:s,ts:Date.now()});
    this.list.sort((a,b)=>b.score-a.score);this.list=this.list.slice(0,100);
    DB.set('leaderboard',this.list);
    const mb=DB.get('best')||{};const r=!mb[g]||s>mb[g];
    if(r){mb[g]=s;DB.set('best',mb);}
    return r;
  },
  top(n=20){return this.list.slice(0,n)},
  myRank(){const p=DB.get('profile');const i=this.list.findIndex(e=>e.id===p.id);return i>=0?i+1:0}
};

class Base {
  constructor(){
    this.canvas=document.getElementById('cv');
    this.ctx=this.canvas.getContext('2d',{alpha:false});
    this.w=0;this.h=0;this.state='playing';this.score=0;
    this.hudEl=document.getElementById('hud');
    this._r=()=>this.resize();
    window.addEventListener('resize',this._r);
    this.resize();
  }
  resize(){
    const d=Math.min(window.devicePixelRatio||1,2.5);
    this.canvas.width=Math.floor(window.innerWidth*d);
    this.canvas.height=Math.floor(window.innerHeight*d);
    this.canvas.style.width=window.innerWidth+'px';
    this.canvas.style.height=window.innerHeight+'px';
    this.ctx.setTransform(d,0,0,d,0,0);
    this.ctx._dpr=d;
    this.w=window.innerWidth;this.h=window.innerHeight;
    if(this.layout)this.layout();
  }
  setHud(h){if(this.hudEl.innerHTML!==h)this.hudEl.innerHTML=h;}
  finish(title,sub){
    if(this.state==='over')return;
    this.state='over';
    const r=LB.submit(GameMan.gameId,Math.floor(this.score));
    DB.set('plays',DB.get('plays')+1);
    GameMan.showOver(Math.floor(this.score),r,title,sub);
  }
  destroy(){window.removeEventListener('resize',this._r);this.hudEl.innerHTML='';}
}

const GameMan={
  games:{},current:null,gameId:null,raf:0,last:0,
  register(id,c){this.games[id]=c;},
  start(id){
    this.halt();
    const C=this.games[id];if(!C)return;
    this.gameId=id;
    document.getElementById('menu').style.display='none';
    document.getElementById('game').classList.add('on');
    document.getElementById('over').classList.remove('show');
    document.getElementById('dpad').classList.remove('on');
    document.getElementById('console-panel').classList.remove('show');
    this.current=new C();
    if(this.current.init)this.current.init();
    this.last=nw();
    this.raf=requestAnimationFrame(t=>this.tick(t));
    console.log(`[GameMan] Started: ${id}`);
  },
  tick(t){
    if(!this.current)return;
    const dt=Math.min(0.05,(t-this.last)/1000);
    this.last=t;
    if(this.current.state!=='over'&&this.current.update)this.current.update(dt);
    Par.update(dt);Cam.update(dt);
    this.current.ctx.setTransform(this.current.ctx._dpr||1,0,0,this.current.ctx._dpr||1,0,0);
    this.current.ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--bg').trim()||'#060912';
    this.current.ctx.fillRect(0,0,this.current.w,this.current.h);
    if(this.current.render)this.current.render();
    this.raf=requestAnimationFrame(t2=>this.tick(t2));
  },
  halt(){
    if(this.raf)cancelAnimationFrame(this.raf);
    this.raf=0;
    if(this.current){this.current.destroy();this.current=null;}
  },
  showOver(sc,r,title,sub){
    document.getElementById('o-title').textContent=title||'بازی تمام شد';
    document.getElementById('o-score').textContent=sc;
    let ex='';
    if(r)ex='<b style="color:var(--green)">رکورد جدید!</b> · ';
    const b=DB.get('best')||{};
    ex+='رکورد: <b>'+(b[this.gameId]||0)+'</b>';
    if(sub)ex+='<br>'+sub;
    document.getElementById('o-sub').innerHTML=ex;
    document.getElementById('over').classList.add('show');
    this.halt();
  },
  toMenu(){
    this.halt();
    document.getElementById('game').classList.remove('on');
    document.getElementById('menu').style.display='flex';
    document.getElementById('over').classList.remove('show');
    document.getElementById('dpad').classList.remove('on');
    document.getElementById('console-panel').classList.remove('show');
    renderStats();
  },
  retry(){if(this.gameId)this.start(this.gameId);}
};

GameMan.register('snake',class extends Base{
  init(){
    this.cols=20;this.rows=24;this.layout();this.reset();
    const keyMap={arrowup:[0,-1],arrowdown:[0,1],arrowleft:[-1,0],arrowright:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0]};
    this._k=e=>{
      const d=keyMap[e.key.toLowerCase()];
      if(!d)return;e.preventDefault();
      this.applyDir(d[0],d[1]);
    };
    window.addEventListener('keydown',this._k);
    const dpad=document.getElementById('dpad');
    dpad.classList.add('on');
    this._dpHandler=e=>{
      e.preventDefault();
      const btn=e.target.closest('button');
      if(!btn)return;
      const dirMap={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
      const d=dirMap[btn.dataset.dir];
      if(d)this.applyDir(d[0],d[1]);
    };
    dpad.addEventListener('pointerdown',this._dpHandler);
    this._dpEl=dpad;
    let sx=0,sy=0;
    this._d=e=>{sx=e.clientX;sy=e.clientY;};
    this._u=e=>{
      const dx=e.clientX-sx,dy=e.clientY-sy;
      if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
      if(Math.abs(dx)>Math.abs(dy))this.applyDir(dx>0?1:-1,0);
      else this.applyDir(0,dy>0?1:-1);
    };
    this.canvas.addEventListener('pointerdown',this._d);
    window.addEventListener('pointerup',this._u);
  }
  applyDir(dx,dy){
    if(dx===-this.dir.x&&dy===-this.dir.y)return;
    this.nextDir={x:dx,y:dy};
  }
  layout(){
    this.cell=Math.floor(Math.min((this.w-20)/20,(this.h-190)/24));
    this.ox=(this.w-this.cols*this.cell)/2;
    this.oy=60+(this.h-190-this.rows*this.cell)/2;
  }
  reset(){
    this.snake=[{x:9,y:12},{x:8,y:12},{x:7,y:12}];
    this.dir={x:1,y:0};this.nextDir={x:1,y:0};
    this.acc=0;this.step=0.13;this.score=0;
    this.food=this.newFood();this.grow=0;this.hue=0;
    this.setHud('<div class="pill">امتیاز <b>0</b></div><div class="pill">طول <b>3</b></div>');
  }
  newFood(){
    let f,g=0;
    do{f={x:randInt(0,this.cols-1),y:randInt(0,this.rows-1)};g++;}
    while(g<400&&this.snake.some(s=>s.x===f.x&&s.y===f.y));
    return f;
  }
  update(dt){
    if(this.state!=='playing')return;
    this.hue=(this.hue+dt*28)%360;
    this.acc+=dt;
    if(this.acc<this.step)return;
    this.acc=0;
    this.dir={...this.nextDir};
    const h={x:this.snake[0].x+this.dir.x,y:this.snake[0].y+this.dir.y};
    if(h.x<0||h.x>=this.cols||h.y<0||h.y>=this.rows||
      this.snake.some((s,i)=>i>0&&s.x===h.x&&s.y===h.y)){
      this.state='over';Snd.hit();Hap.heavy();Cam.add(1.3);
      const px=this.ox+this.snake[0].x*this.cell+this.cell/2;
      const py=this.oy+this.snake[0].y*this.cell+this.cell/2;
      Par.spawn(px,py,45,{color:'#ff2d78',minSpeed:110,maxSpeed:440,gravity:480});
      console.log(`[Snake] Game over. Score: ${this.score}`);
      setTimeout(()=>this.finish(),500);return;
    }
    this.snake.unshift(h);
    if(h.x===this.food.x&&h.y===this.food.y){
      this.score+=15;this.grow+=2;Snd.coin();Hap.ok();
      this.food=this.newFood();
      this.step=Math.max(0.055,this.step-0.003);
      const fx=this.ox+h.x*this.cell+this.cell/2,fy=this.oy+h.y*this.cell+this.cell/2;
      Par.spawn(fx,fy,16,{color:'#2bff88',minSpeed:55,maxSpeed:190,gravity:250});
    }
    if(this.grow>0)this.grow--;else this.snake.pop();
    this.setHud(`<div class="pill">امتیاز <b>${this.score}</b></div><div class="pill">طول <b>${this.snake.length}</b></div>`);
  }
  render(){
    const c=this.ctx;
    const bg=c.createLinearGradient(0,0,this.w,this.h);
    bg.addColorStop(0,'#0a1628');bg.addColorStop(1,'#1a0a2e');
    c.fillStyle=bg;c.fillRect(0,0,this.w,this.h);
    c.strokeStyle='rgba(0,229,255,0.04)';c.lineWidth=1;
    for(let i=0;i<=this.cols;i++){const x=this.ox+i*this.cell;c.beginPath();c.moveTo(x,this.oy);c.lineTo(x,this.oy+this.rows*this.cell);c.stroke();}
    for(let j=0;j<=this.rows;j++){const y=this.oy+j*this.cell;c.beginPath();c.moveTo(this.ox,y);c.lineTo(this.ox+this.cols*this.cell,y);c.stroke();}
    const fx=this.ox+this.food.x*this.cell+this.cell/2,fy=this.oy+this.food.y*this.cell+this.cell/2;
    const pl=0.85+Math.sin(nw()/180)*0.15;
    c.fillStyle='#2bff88';c.shadowColor='#2bff88';c.shadowBlur=20;
    c.beginPath();c.arc(fx,fy,this.cell*0.34*pl,0,TAU);c.fill();c.shadowBlur=0;
    for(let i=this.snake.length-1;i>=0;i--){
      const s=this.snake[i];
      const x=this.ox+s.x*this.cell+1.5,y=this.oy+s.y*this.cell+1.5,w=this.cell-3,t=i/Math.max(1,this.snake.length);
      if(i===0){c.fillStyle='#00e5ff';c.shadowColor='#00e5ff';c.shadowBlur=14;}
      else c.fillStyle=`hsl(${(this.hue+i*5)%360},90%,${60-t*22}%)`;
      c.beginPath();
      if(c.roundRect)c.roundRect(x,y,w,w,w*0.3);else c.rect(x,y,w,w);
      c.fill();c.shadowBlur=0;
      if(i===0){
        const es=Math.max(2,w*0.16);c.fillStyle='#03121a';
        if(this.dir.x===1){c.fillRect(x+w*0.58,y+w*0.22,es,es);c.fillRect(x+w*0.58,y+w*0.58,es,es);}
        else if(this.dir.x===-1){c.fillRect(x+w*0.24,y+w*0.22,es,es);c.fillRect(x+w*0.24,y+w*0.58,es,es);}
        else if(this.dir.y===1){c.fillRect(x+w*0.22,y+w*0.58,es,es);c.fillRect(x+w*0.58,y+w*0.58,es,es);}
        else{c.fillRect(x+w*0.22,y+w*0.22,es,es);c.fillRect(x+w*0.58,y+w*0.22,es,es);}
      }
    }
  }
  destroy(){
    super.destroy();
    window.removeEventListener('keydown',this._k);
    this.canvas.removeEventListener('pointerdown',this._d);
    window.removeEventListener('pointerup',this._u);
    if(this._dpEl)this._dpEl.removeEventListener('pointerdown',this._dpHandler);
  }
});

GameMan.register('lumberjack',class extends Base{
  init(){
    this.tx=this.w/2;this.tw=Math.min(this.w*0.2,90);
    this.trunkY=this.h*0.52;this.bh=Math.min(58,this.h*0.085);
    this.side=0;this.chopT=0;this.timer=1;this.drain=0.28;this.score=0;
    this.branches=[];this.initB();
    this.setHud('<div class="pill">امتیاز <b>0</b></div><div class="pill">⏱ <b>100%</b></div>');
    const dp=document.getElementById('dpad');
    dp.classList.add('on');
    this._dpHandler=e=>{
      e.preventDefault();
      const b=e.target.closest('button');
      if(!b)return;
      if(b.dataset.dir==='left')this.chop(-1);
      if(b.dataset.dir==='right')this.chop(1);
    };
    dp.addEventListener('pointerdown',this._dpHandler);
    this._dpEl=dp;
    this._k=e=>{
      if(e.key==='ArrowLeft'||e.key==='a'){e.preventDefault();this.chop(-1);}
      if(e.key==='ArrowRight'||e.key==='d'){e.preventDefault();this.chop(1);}
    };
    window.addEventListener('keydown',this._k);
  }
  initB(){
    this.branches=[];
    for(let i=0;i<14;i++){
      const r=Math.random();let s=0;
      if(r<0.42)s=Math.random()<0.5?-1:1;
      this.branches.push({side:s,y:this.trunkY-i*this.bh});
    }
    this.branches[0].side=0;this.branches[1].side=0;
  }
  chop(side){
    if(this.state!=='playing')return;
    this.side=side;this.chopT=0.12;
    const nb=this.branches[1];
    if(nb&&nb.side===side){
      this.state='over';Snd.hit();Hap.heavy();Cam.add(1.4);
      console.log(`[Lumberjack] Hit branch. Score: ${this.score}`);
      setTimeout(()=>this.finish('شاخه خوردی!',`امتیاز: ${this.score}`),600);return;
    }
    this.score++;
    this.timer=Math.min(1,this.timer+0.11);
    this.drain=Math.min(0.65,0.28+this.score*0.0025);
    this.branches.shift();
    const ly=this.branches.length?this.branches[this.branches.length-1].y:this.trunkY;
    const r=Math.random();let ns=0;
    if(r<0.42)ns=Math.random()<0.5?-1:1;
    this.branches.push({side:ns,y:ly+this.bh});
    Snd.chop();Hap.med();Cam.add(0.06);
    this.setHud(`<div class="pill">امتیاز <b>${this.score}</b></div><div class="pill">⏱ <b>${Math.ceil(this.timer*100)}%</b></div>`);
  }
  update(dt){
    if(this.state!=='playing')return;
    if(this.chopT>0)this.chopT=Math.max(0,this.chopT-dt);
    this.timer-=this.drain*dt;
    if(this.timer<=0){
      this.timer=0;this.state='over';Snd.lose();Hap.heavy();
      console.log(`[Lumberjack] Time out. Score: ${this.score}`);
      setTimeout(()=>this.finish('زمان تمام شد!',`امتیاز: ${this.score}`),600);
    }
  }
  render(){
    const c=this.ctx;
    const bg=c.createLinearGradient(0,0,0,this.h);
    bg.addColorStop(0,'#1a2f1a');bg.addColorStop(0.5,'#0d1f0d');bg.addColorStop(1,'#2a1a0a');
    c.fillStyle=bg;c.fillRect(0,0,this.w,this.h);
    c.fillStyle='#2b1a0e';c.fillRect(this.tx-this.tw/2,this.trunkY,this.tw,this.h-this.trunkY);
    c.fillStyle='#3d2814';c.fillRect(this.tx-this.tw/2,this.trunkY,this.tw*0.3,this.h-this.trunkY);
    for(const b of this.branches){
      if(b.y>this.h||b.y<-this.bh)continue;
      if(b.side===0)continue;
      const bx=b.side===-1?this.tx-this.tw/2-this.tw*0.55:this.tx+this.tw/2;
      c.fillStyle='#4a7c3f';c.shadowColor='#2bff88';c.shadowBlur=6;
      c.fillRect(bx,b.y,this.tw*0.55,this.bh*0.32);c.shadowBlur=0;
    }
    const px=this.side===-1?this.tx-this.tw/2-this.tw*0.45:this.tx+this.tw/2+this.tw*0.45;
    const py=this.trunkY-14;
    c.fillStyle='#ffc531';c.beginPath();c.arc(px,py,9,0,TAU);c.fill();
    c.fillStyle='#2b1a0e';c.fillRect(px-4,py+6,8,16);
    c.fillStyle='#c0c8d4';c.fillRect(px+4,py+10,3,13);
    c.fillStyle='#8b5a2b';c.fillRect(px+4,py+21,7,3);
    c.fillStyle='rgba(0,0,0,0.45)';c.fillRect(this.w*0.1,55,this.w*0.8,7);
    c.fillStyle=this.timer<0.3?'#ff2d78':'#2bff88';
    c.fillRect(this.w*0.1,55,this.w*0.8*this.timer,7);
  }
  destroy(){
    super.destroy();
    document.getElementById('dpad').classList.remove('on');
    if(this._dpEl)this._dpEl.removeEventListener('pointerdown',this._dpHandler);
    window.removeEventListener('keydown',this._k);
  }
});

GameMan.register('pong',class extends Base{
  init(){
    this.ph=52;this.pw=9;
    this.p1={x:15,y:this.h/2-this.ph/2};
    this.p2={x:this.w-24,y:this.h/2-this.ph/2};
    this.s1=0;this.s2=0;
    this.ball={x:this.w/2,y:this.h/2,vx:280,vy:rand(-125,125),r:7};
    this.ai=3.6;
    this.setHud('<div class="pill">شما <b>0</b></div><div class="pill">حریف <b>0</b></div>');
    this._m=e=>{
      const r=this.canvas.getBoundingClientRect();
      this.p1.y=clamp(e.clientY-r.top-this.ph/2,55,this.h-this.ph);
    };
    this._k=e=>{
      if(e.key==='ArrowUp'||e.key==='w'){e.preventDefault();this.p1.y=clamp(this.p1.y-30,55,this.h-this.ph);}
      if(e.key==='ArrowDown'||e.key==='s'){e.preventDefault();this.p1.y=clamp(this.p1.y+30,55,this.h-this.ph);}
    };
    this.canvas.addEventListener('pointermove',this._m);
    window.addEventListener('keydown',this._k);
  }
  setHud(h){if(this.hudEl.innerHTML!==h)this.hudEl.innerHTML=h;}
  reset(){
    this.ball.x=this.w/2;this.ball.y=this.h/2;
    this.ball.vx=rand([-300,300]);this.ball.vy=rand(-135,135);
    Snd.t(300,0.06,'sine',0.06);
  }
  update(dt){
    if(this.state!=='playing')return;
    const b=this.ball;
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.y-b.r<55){b.y=b.r+55;b.vy*=-1;}
    if(b.y+b.r>this.h){b.y=this.h-b.r;b.vy*=-1;}
    if(b.x-b.r<this.p1.x+this.pw&&b.y>this.p1.y&&b.y<this.p1.y+this.ph){
      b.vx=Math.abs(b.vx);
      const hit=(b.y-(this.p1.y+this.ph/2))/(this.ph/2);
      b.vy=hit*300;
      Snd.t(620,0.035,'square',0.06);
    }
    if(b.x+b.r>this.p2.x&&b.y>this.p2.y&&b.y<this.p2.y+this.ph){
      b.vx=-Math.abs(b.vx);
      Snd.t(620,0.035,'square',0.06);
    }
    const predY=b.y+(b.vy*Math.abs((this.p2.x-b.x)/Math.max(1,Math.abs(b.vx))));
    this.p2.y=lerp(this.p2.y,predY-this.ph/2,dt*this.ai);
    this.p2.y=clamp(this.p2.y,55,this.h-this.ph);
    if(b.x<0){this.s2++;this.setHud(`<div class="pill">شما <b>${this.s1}</b></div><div class="pill">حریف <b>${this.s2}</b></div>`);this.reset();}
    if(b.x>this.w){this.s1++;this.setHud(`<div class="pill">شما <b>${this.s1}</b></div><div class="pill">حریف <b>${this.s2}</b></div>`);this.reset();}
    if(this.s1>=5||this.s2>=5){
      this.state='over';Snd.lose();Hap.heavy();
      console.log(`[Pong] Final: ${this.s1}-${this.s2}`);
      setTimeout(()=>this.finish(),550);
    }
  }
  render(){
    const c=this.ctx;
    const bg=c.createLinearGradient(0,0,this.w,0);
    bg.addColorStop(0,'#0a1628');bg.addColorStop(0.5,'#06121f');bg.addColorStop(1,'#1a0a2e');
    c.fillStyle=bg;c.fillRect(0,0,this.w,this.h);
    c.fillStyle='#00e5ff';c.fillRect(this.p1.x,this.p1.y,this.pw,this.ph);
    c.fillStyle='#ff2d78';c.fillRect(this.p2.x,this.p2.y,this.pw,this.ph);
    c.fillStyle='#fff';c.shadowColor='#ffc531';c.shadowBlur=14;
    c.beginPath();c.arc(this.ball.x,this.ball.y,this.ball.r,0,TAU);c.fill();c.shadowBlur=0;
    c.strokeStyle='rgba(255,255,255,0.06)';c.setLineDash([8,10]);
    c.beginPath();c.moveTo(this.w/2,55);c.lineTo(this.w/2,this.h);c.stroke();c.setLineDash([]);
  }
  destroy(){
    super.destroy();
    this.canvas.removeEventListener('pointermove',this._m);
    window.removeEventListener('keydown',this._k);
  }
});

GameMan.register('tetris',class extends Base{
  init(){
    this.layout();
    this.shapes={I:[[1,1,1,1]],O:[[1,1],[1,1]],T:[[0,1,0],[1,1,1]],S:[[0,1,1],[1,1,0]],Z:[[1,1,0],[0,1,1]],J:[[1,0,0],[1,1,1]],L:[[0,0,1],[1,1,1]]};
    this.colors={I:'#00e5ff',O:'#ffc531',T:'#a855f7',S:'#2bff88',Z:'#ff2d78',J:'#0088cc',L:'#ff7a00'};
    this.board=Array.from({length:20},()=>Array(10).fill(0));
    this.score=0;this.dropAcc=0;this.dropInt=0.85;this.bag=[];this.next=[];this.piece=null;
    this.soft=false;this.clearRows=[];this.clearT=0;this.spawn();
    this.setHud('<div class="pill">امتیاز <b>0</b></div>');
    this._k=e=>{
      if(this.state!=='playing')return;
      const k=e.key.toLowerCase();
      if(k==='arrowleft'||k==='a'){e.preventDefault();this.move(-1);}
      if(k==='arrowright'||k==='d'){e.preventDefault();this.move(1);}
      if(k==='arrowup'||k==='w'){e.preventDefault();this.rotate();}
      if(k==='arrowdown'||k==='s'){e.preventDefault();this.soft=true;}
      if(k===' '){e.preventDefault();this.hardDrop();}
    };
    this._ku=e=>{
      const k=e.key.toLowerCase();
      if(k==='arrowdown'||k==='s')this.soft=false;
    };
    window.addEventListener('keydown',this._k);
    window.addEventListener('keyup',this._ku);
  }
  layout(){
    this.cell=Math.floor(Math.min((this.w-140)/10,(this.h-130)/20));
    this.gw=this.cell*10;this.gh=this.cell*20;
    this.bx=(this.w-this.gw)/2-28;this.by=60+(this.h-130-this.gh)/2;
    this.nx=this.bx+this.gw+10;this.ny=this.by;
  }
  refill(){this.bag=Object.keys(this.shapes).sort(()=>Math.random()-0.5);}
  pull(){if(!this.bag.length)this.refill();return this.bag.pop();}
  spawn(){
    while(this.next.length<3)this.next.push(this.pull());
    const tp=this.next.shift();this.next.push(this.pull());
    const sh=this.shapes[tp];
    this.piece={type:tp,shape:sh.map(r=>r.slice()),x:Math.floor((10-sh[0].length)/2),y:0};
    if(this.collide(this.piece.shape,this.piece.x,this.piece.y)){
      this.state='over';Snd.lose();Hap.heavy();
      console.log('[Tetris] Game over - board full');
      setTimeout(()=>this.finish(),550);
    }
  }
  collide(sh,px,py){
    for(let r=0;r<sh.length;r++)for(let c=0;c<sh[r].length;c++){
      if(!sh[r][c])continue;
      const x=px+c,y=py+r;
      if(x<0||x>=10||y>=20)return true;
      if(y>=0&&this.board[y][x])return true;
    }
    return false;
  }
  move(dx){if(!this.piece)return;if(!this.collide(this.piece.shape,this.piece.x+dx,this.piece.y)){this.piece.x+=dx;Snd.ui();}}
  rotate(){
    if(!this.piece)return;
    const s=this.piece.shape;
    const r=s[0].map((_,i)=>s.map(row=>row[i]).reverse());
    for(const k of[0,-1,1,-2,2])if(!this.collide(r,this.piece.x+k,this.piece.y)){this.piece.shape=r;this.piece.x+=k;Snd.ui();return;}
  }
  hardDrop(){
    if(!this.piece)return;
    let d=0;
    while(!this.collide(this.piece.shape,this.piece.x,this.piece.y+1)){this.piece.y++;d++;}
    this.score+=d*2;Snd.t(240,0.09,'square',0.07);Hap.med();this.lock();
  }
  lock(){
    if(!this.piece)return;
    for(let r=0;r<this.piece.shape.length;r++)for(let c=0;c<this.piece.shape[r].length;c++){
      if(this.piece.shape[r][c]){const x=this.piece.x+c,y=this.piece.y+r;if(y>=0)this.board[y][x]=this.colors[this.piece.type];}
    }
    this.piece=null;
    const full=[];
    for(let r=0;r<20;r++)if(this.board[r].every(v=>v))full.push(r);
    if(full.length){
      this.clearRows=full;this.clearT=0.26;
      Snd.win();Hap.success();Cam.add(0.3);
      this.score+=[0,100,300,500,800][full.length]||800;
      this.setHud(`<div class="pill">امتیاز <b>${this.score}</b></div>`);
      console.log(`[Tetris] Lines cleared: ${full.length}, Score: ${this.score}`);
    }else this.spawn();
  }
  applyClear(){
    for(const r of this.clearRows)for(let c=0;c<10;c++){
      const x=this.bx+c*this.cell+this.cell/2,y=this.by+r*this.cell+this.cell/2;
      Par.spawn(x,y,7,{color:this.board[r][c],minSpeed:65,maxSpeed:220,gravity:380});
    }
    this.clearRows.sort((a,b)=>a-b);
    for(const r of this.clearRows){this.board.splice(r,1);this.board.unshift(Array(10).fill(0));}
    this.clearRows=[];this.clearT=0;this.spawn();
  }
  update(dt){
    if(this.state!=='playing')return;
    if(this.clearRows.length){this.clearT-=dt;if(this.clearT<=0)this.applyClear();return;}
    if(!this.piece)return;
    this.dropAcc+=dt;
    const iv=this.soft?0.042:this.dropInt;
    if(this.dropAcc>=iv){
      this.dropAcc=0;
      if(!this.collide(this.piece.shape,this.piece.x,this.piece.y+1))this.piece.y++;
      else this.lock();
    }
  }
  db(c,x,y,s,col){
    const g=c.createLinearGradient(x,y,x+s,y+s);
    g.addColorStop(0,this.lt(col,40));g.addColorStop(1,this.dk(col,45));
    c.fillStyle=g;c.beginPath();
    if(c.roundRect)c.roundRect(x+1,y+1,s-2,s-2,4);else c.rect(x+1,y+1,s-2,s-2);
    c.fill();c.strokeStyle='rgba(255,255,255,0.3)';c.lineWidth=1;c.stroke();
  }
  lt(h,a){const x=h.replace('#','');return'#'+[0,2,4].map(i=>Math.min(255,parseInt(x.substr(i,2),16)+a).toString(16).padStart(2,'0')).join('');}
  dk(h,a){const x=h.replace('#','');return'#'+[0,2,4].map(i=>Math.max(0,parseInt(x.substr(i,2),16)-a).toString(16).padStart(2,'0')).join('');}
  render(){
    const c=this.ctx;
    const bg=c.createLinearGradient(0,0,this.w,this.h);
    bg.addColorStop(0,'#0a0a1a');bg.addColorStop(1,'#1a0a2a');
    c.fillStyle=bg;c.fillRect(0,0,this.w,this.h);
    c.fillStyle='rgba(0,0,0,0.55)';c.fillRect(this.bx-5,this.by-5,this.gw+10,this.gh+10);
    c.strokeStyle='rgba(0,229,255,0.3)';c.lineWidth=2;c.strokeRect(this.bx-5,this.by-5,this.gw+10,this.gh+10);
    for(let r=0;r<20;r++)for(let cc=0;cc<10;cc++){
      const x=this.bx+cc*this.cell,y=this.by+r*this.cell;
      if(this.board[r][cc])this.db(c,x,y,this.cell,this.board[r][cc]);
      else{c.strokeStyle='rgba(255,255,255,0.03)';c.lineWidth=1;c.strokeRect(x+0.5,y+0.5,this.cell-1,this.cell-1);}
    }
    for(const r of this.clearRows){c.fillStyle=`rgba(255,255,255,${0.5+Math.random()*0.4})`;c.fillRect(this.bx,this.by+r*this.cell,this.gw,this.cell);}
    if(this.piece){
      let gy=this.piece.y;

      for(let r=0;r<this.piece.shape.length;r++)for(let cc=0;cc<this.piece.shape[r].length;cc++){
        if(!this.piece.shape[r][cc])continue;
        const x=this.bx+(this.piece.x+cc)*this.cell,y=this.by+(gy+r)*this.cell;

      for(let r=0;r<this.piece.shape.length;r++)for(let cc=0;cc<this.piece.shape[r].length;cc++){
        if(this.piece.shape[r][cc]){const x=this.bx+(this.piece.x+cc)*this.cell,y=this.by+(this.piece.y+r)*this.cell;this.db(c,x,y,this.cell,this.colors[this.piece.type]);}
      }
    }
  }
  destroy(){super.destroy();window.removeEventListener('keydown',this._k);window.removeEventListener('keyup',this._ku);}
});

GameMan.register('2048',class extends Base{
  init(){
    this.layout();
    this.grid=Array.from({length:4},()=>Array(4).fill(0));
    this.score=0;this.add();this.add();this.hud();
    this._k=e=>{
      const m={arrowleft:'left',arrowright:'right',arrowup:'up',arrowdown:'down',a:'left',d:'right',w:'up',s:'down'};
      const d=m[e.key.toLowerCase()];if(!d)return;e.preventDefault();this.slide(d);
    };
    window.addEventListener('keydown',this._k);
    this._sx=0;this._sy=0;
    this._d=e=>{this._sx=e.clientX;this._sy=e.clientY;};
    this._u=e=>{
      const dx=e.clientX-this._sx,dy=e.clientY-this._sy;
      if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
      if(Math.abs(dx)>Math.abs(dy))this.slide(dx>0?'right':'left');
      else this.slide(dy>0?'down':'up');
    };
    this.canvas.addEventListener('pointerdown',this._d);
    this.canvas.addEventListener('pointerup',this._u);
  }
  layout(){
    this.cell=Math.floor(Math.min((this.w-40)/4,(this.h-170)/4));
    this.gap=Math.max(4,this.cell*0.07);
    this.gx=(this.w-(this.cell*4+this.gap*3))/2;this.gy=80;
  }
  hud(){this.setHud(`<div class="pill">امتیاز <b>${this.score}</b></div>`);}
  add(){
    const em=[];
    for(let r=0;r<4;r++)for(let c=0;c<4;c++)if(!this.grid[r][c])em.push([r,c]);
    if(!em.length)return;
    const[r,c]=em[randInt(0,em.length-1)];
    this.grid[r][c]=Math.random()<0.9?2:4;
  }
  slide(dir){
    if(this.state!=='playing')return;
    let moved=false;
    const b=this.grid.map(r=>r.slice());
    const comb=line=>{
      const a=line.filter(v=>v),out=[];
      for(let i=0;i<a.length;i++){
        if(i<a.length-1&&a[i]===a[i+1]){const v=a[i]*2;out.push(v);this.score+=v;i++;moved=true;}
        else out.push(a[i]);
      }
      while(out.length<4)out.push(0);
      return out;
    };
    if(dir==='left'||dir==='right'){
      for(let r=0;r<4;r++){
        let row=b[r].slice();
        if(dir==='right')row.reverse();
        row=comb(row);
        if(dir==='right')row.reverse();
        if(row.join()!==b[r].join())moved=true;
        b[r]=row;
      }
    }else{
      for(let c=0;c<4;c++){
        let col=b.map(r=>r[c]);
        if(dir==='down')col.reverse();
        col=comb(col);
        if(dir==='down')col.reverse();
        for(let r=0;r<4;r++){if(b[r][c]!==col[r])moved=true;b[r][c]=col[r];}
      }
    }
    if(!moved)return;
    this.grid=b;this.add();this.hud();
    Snd.t(500,0.06,'triangle',0.06);Hap.ok();
    if(this.grid.flat().includes(2048)){this.finish('برنده!','به ۲۰۴۸ رسیدی');return;}
    if(this.dead()){
      this.state='over';Snd.lose();Hap.heavy();
      console.log(`[2048] Game over. Score: ${this.score}`);
      setTimeout(()=>this.finish(),550);
    }
  }
  dead(){
    for(let r=0;r<4;r++)for(let c=0;c<4;c++){
      if(!this.grid[r][c])return false;
      if(c<3&&this.grid[r][c]===this.grid[r][c+1])return false;
      if(r<3&&this.grid[r][c]===this.grid[r+1][c])return false;
    }
    return true;
  }
  render(){
    const c=this.ctx;
    const bg=c.createLinearGradient(0,0,this.w,this.h);
    bg.addColorStop(0,'#0a1628');bg.addColorStop(1,'#0a2e1a');
    c.fillStyle=bg;c.fillRect(0,0,this.w,this.h);
    const cols={2:'#1a2a4a',4:'#1f3a5a',8:'#2a5a6a',16:'#2a7a6a',32:'#3a9a5a',64:'#5aba3a',128:'#9aca2a',256:'#daca2a',512:'#eaaa2a',1024:'#ea7a2a',2048:'#ea3a5a'};
    c.fillStyle='rgba(0,229,255,0.03)';c.beginPath();
    if(c.roundRect)c.roundRect(this.gx-6,this.gy-6,this.cell*4+this.gap*3+12,this.cell*4+this.gap*3+12,13);
    else c.rect(this.gx-6,this.gy-6,this.cell*4+this.gap*3+12,this.cell*4+this.gap*3+12);
    c.fill();
    for(let r=0;r<4;r++)for(let cc=0;cc<4;cc++){
      const v=this.grid[r][cc],x=this.gx+cc*(this.cell+this.gap),y=this.gy+r*(this.cell+this.gap);
      c.fillStyle=v?(cols[v]||'#ff2d78'):'rgba(255,255,255,0.03)';
      c.beginPath();
      if(c.roundRect)c.roundRect(x,y,this.cell,this.cell,8);else c.rect(x,y,this.cell,this.cell);
      c.fill();
      if(v){
        if(v>=8){c.shadowColor=cols[v];c.shadowBlur=10;}
        c.fillStyle=v>=8?'#fff':'#c5d5e8';
        c.font=`900 ${Math.max(13,this.cell*0.32)}px Tahoma`;
        c.textAlign='center';c.textBaseline='middle';
        c.fillText(v,x+this.cell/2,y+this.cell/2);c.shadowBlur=0;
      }
    }
  }
  destroy(){super.destroy();window.removeEventListener('keydown',this._k);this.canvas.removeEventListener('pointerdown',this._d);this.canvas.removeEventListener('pointerup',this._u);}
});

GameMan.register('breakout',class extends Base{
  init(){
    this.pw=this.w*0.23;this.ph=13;this.py=this.h-75;

    this.ball={x:this.w/2,y:this.py-20,vx:0,vy:0,sp:430};
    this.ln=false;this.bricks=[];this.score=0;this.lives=3;
    this.build();this.hud();
    this._m=e=>{
      const r=this.canvas.getBoundingClientRect();
      this.px=clamp(e.clientX-r.left-this.pw/2,0,this.w-this.pw);
    };
    this._t=e=>{
      this._m(e);
      if(!this.ln&&this.state==='playing'){this.ln=true;this.ball.vx=rand(-195,195);this.ball.vy=-this.ball.sp;Snd.t(600,0.06,'sine',0.095);}
    };
    this.canvas.addEventListener('pointerdown',this._t);

  build(){
    const cols=9,bw=(this.w-42)/cols,bh=21;

    for(let r=0;r<5;r++)for(let c=0;c<cols;c++)
      this.bricks.push({x:21+c*bw+2,y:76+r*(bh+5),w:bw-4,h:bh,color:pal[r],alive:true});
  }
  hud(){this.setHud(`<div class="pill">امتیاز <b>${this.score}</b></div><div class="pill">❤️ ${this.lives}</div>`);}
  update(dt){
    if(this.state!=='playing')return;
    if(!this.ln){this.ball.x=this.px+this.pw/2;this.ball.y=this.py-20;return;}
    const b=this.ball;
    b.x+=b.vx*dt;b.y+=b.vy*dt;
    if(b.x-this.br<0){b.x=this.br;b.vx*=-1;Snd.t(400,0.03,'square',0.04);}
    if(b.x+this.br>this.w){b.x=this.w-this.br;b.vx*=-1;Snd.t(400,0.03,'square',0.04);}
    if(b.y-this.br<55){b.y=this.br+55;b.vy*=-1;Snd.t(400,0.03,'square',0.04);}
    if(b.y+this.br>this.py&&b.x>this.px&&b.x<this.px+this.pw&&b.vy>0){
      const hit=(b.x-this.px)/this.pw,ang=(hit-0.5)*Math.PI*0.85,sp=Math.hypot(b.vx,b.vy);
      b.vx=Math.sin(ang)*sp;b.vy=-Math.abs(Math.cos(ang)*sp);b.y=this.py-this.br;
      Snd.t(700,0.05,'sine',0.08);Hap.ok();
    }
    for(const br of this.bricks){
      if(!br.alive)continue;
      if(b.x+this.br>br.x&&b.x-this.br<br.x+br.w&&b.y+this.br>br.y&&b.y-this.br<br.y+br.h){
        br.alive=false;this.score+=25;Snd.t(820,0.035,'square',0.075);Hap.ok();Cam.add(0.08);
        Par.spawn(br.x+br.w/2,br.y+br.h/2,10,{color:br.color,minSpeed:60,maxSpeed:220,gravity:360});
        if(Math.abs(b.x-(br.x+br.w/2))/br.w>Math.abs(b.y-(br.y+br.h/2))/br.h)b.vx*=-1;else b.vy*=-1;
        this.hud();break;
      }
    }
    if(b.y-this.br>this.h){
      this.lives--;Snd.hit();Hap.heavy();Cam.add(0.8);this.hud();
      console.log(`[Breakout] Life lost. Lives: ${this.lives}, Score: ${this.score}`);
      if(this.lives<=0){this.state='over';setTimeout(()=>this.finish(),550);}
      else{this.ln=false;this.ball.x=this.w/2;this.ball.y=this.py-20;this.ball.vx=0;this.ball.vy=0;this.px=(this.w-this.pw)/2;}
    }
    if(this.bricks.every(br=>!br.alive)){Snd.win();Hap.success();this.finish('مرحله تمام!','+۲۰۰ امتیاز');}
  }
  render(){
    const c=this.ctx;
    const bg=c.createLinearGradient(0,0,this.w,this.h);
    bg.addColorStop(0,'#0a0a2e');bg.addColorStop(1,'#2e0a1a');
    c.fillStyle=bg;c.fillRect(0,0,this.w,this.h);
    for(const br of this.bricks){
      if(!br.alive)continue;
      const g=c.createLinearGradient(br.x,br.y,br.x,br.y+br.h);
      g.addColorStop(0,br.color);g.addColorStop(1,'rgba(0,0,0,0.5)');
      c.fillStyle=g;c.shadowColor=br.color;c.shadowBlur=5;
      c.beginPath();
      if(c.roundRect)c.roundRect(br.x,br.y,br.w,br.h,4);else c.rect(br.x,br.y,br.w,br.h);
      c.fill();c.shadowBlur=0;
    }
    c.fillStyle='#00e5ff';c.shadowColor='#00e5ff';c.shadowBlur=14;
    c.beginPath();
    if(c.roundRect)c.roundRect(this.px,this.py,this.pw,this.ph,6);else c.rect(this.px,this.py,this.pw,this.ph);
    c.fill();c.shadowBlur=0;
    c.fillStyle='#fff';c.shadowColor='#ffc531';c.shadowBlur=12;
    c.beginPath();c.arc(this.ball.x,this.ball.y,this.br,0,TAU);c.fill();c.shadowBlur=0;
    if(!this.ln){
      c.fillStyle='rgba(0,0,0,0.5)';c.fillRect(this.w/2-100,this.h/2-20,200,36);
      c.fillStyle='#fff';c.font='bold 13px Tahoma';c.textAlign='center';c.textBaseline='middle';
      c.fillText('برای شلیک ضربه بزن',this.w/2,this.h/2);
    }
  }
  destroy(){super.destroy();this.canvas.removeEventListener('pointerdown',this._t);this.canvas.removeEventListener('pointermove',this._m);}
});

function renderStats(){
  const t=Object.values(DB.get('best')||{}).reduce((a,b)=>a+b,0);
  document.getElementById('stats').innerHTML=
    `<div class="chip">🏆 مجموع <b>${t}</b></div>`+
    `<div class="chip">🎮 <b>${GAME_LIST.length}</b></div>`+
    `<div class="chip">▶️ <b>${DB.get('plays')||0}</b></div>`;
}
function renderUser(){
  const p=DB.get('profile');
  const av=document.getElementById('userAv'),nm=document.getElementById('userName');
  nm.textContent=p.name||'بازیکن';
  if(p.avatar)av.innerHTML=`<img src="${p.avatar}" alt="">`;
  else av.textContent=(p.name||'?').charAt(0).toUpperCase();
}
function renderMenu(){
  const g=document.getElementById('grid');g.innerHTML='';
  for(const gm of GAME_LIST){
    const cd=document.createElement('div');
    cd.className='card';cd.style.setProperty('--accent',gm.color);
    const b=(DB.get('best')||{})[gm.id]||0;
    cd.innerHTML=`<div class="ic">${gm.icon}</div><div class="nm">${gm.name}</div><div class="ds">${gm.desc}</div>${b?`<div class="bs">رکورد ${b}</div>`:''}`;
    cd.addEventListener('click',()=>{Snd.ui();GameMan.start(gm.id);});
    g.appendChild(cd);
  }
  renderStats();renderUser();
}
function openSheet(h){
  document.getElementById('sheet').innerHTML=`<button class="close-x" onclick="closeSheet()">✕</button>`+h;
  document.getElementById('modal').classList.add('show');
}
function closeSheet(){document.getElementById('modal').classList.remove('show');}
function showProfile(){
  const p=DB.get('profile');
  openSheet(`<h3>👤 پروفایل بازیکن</h3>
    <label>نام نمایشی</label><input type="text" id="inp-name" value="${p.name||''}" placeholder="نام شما">
    <label>آدرس تصویر پروفایل</label><input type="text" id="inp-avatar" value="${p.avatar||''}" placeholder="https://...">
    <button class="btn" style="margin-top:14px" onclick="saveProfile()">ذخیره تغییرات</button>
    <div style="margin-top:10px;font-size:10px;color:var(--muted);text-align:center">شناسه: ${p.id}</div>`);
}
function saveProfile(){
  const n=document.getElementById('inp-name').value.trim()||'بازیکن';
  const a=document.getElementById('inp-avatar').value.trim();
  DB.data.profile.name=n;DB.data.profile.avatar=a;DB.save();
  renderUser();closeSheet();Snd.win();Hap.success();
}
function showThemes(){
  let sw='';
  THEMES.forEach((t,i)=>{
    sw+=`<div class="tsw ${i===DB.get('theme')?'on':''}" style="background:linear-gradient(135deg,${t.cyan},${t.pink});" onclick="pickTheme(${i})"></div>`;
  });
  openSheet(`<h3>🎨 تم ظاهری</h3><div class="tgrid">${sw}</div>
    <div style="margin-top:12px;font-size:10px;color:var(--muted);text-align:center">پس‌زمینه و رنگ‌های سایت تغییر می‌کند</div>`);
}
function pickTheme(i){applyTheme(i);closeSheet();Snd.ui();Hap.ok();}
function showLeaderboard(){
  const list=LB.top(20);
  const myId=DB.get('profile').id;
  let rows='';
  if(!list.length){
    rows='<div style="text-align:center;color:var(--muted);padding:20px;font-size:12px">هنوز امتیازی ثبت نشده</div>';
  }else{
    list.forEach((e,i)=>{
      const rank=i+1;
      const cls=rank===1?'t1':rank===2?'t2':rank===3?'t3':'';
      const me=e.id===myId?'me':'';
      const av=e.avatar?`<img src="${e.avatar}" alt="">`:(e.name||'?').charAt(0).toUpperCase();
      const gm=GAME_LIST.find(g=>g.id===e.game);
      rows+=`<div class="lb-row ${me}"><div class="lb-rank ${cls}">${rank===1?'🥇':rank===2?'🥈':rank===3?'🥉':rank}</div><div class="lb-av">${av}</div><div class="lb-info"><div class="lb-name">${e.name||'بازیکن'}</div><div class="lb-sub">${gm?gm.name:e.game}</div></div><div class="lb-sc">${e.score}</div></div>`;
    });
  }
  const mr=LB.myRank();
  openSheet(`<h3>🏆 جدول امتیازات</h3>
    <div style="text-align:center;font-size:11px;color:var(--muted);margin-bottom:10px">${mr?`رتبه شما: <b style="color:var(--gold)">${mr}</b>`:'هنوز بازی نکرده‌اید'}</div>${rows}`);
}

document.getElementById('userChip').addEventListener('click',()=>{Snd.ui();showProfile();});
document.getElementById('themeChip').addEventListener('click',()=>{Snd.ui();showThemes();});
document.getElementById('lbChip').addEventListener('click',()=>{Snd.ui();showLeaderboard();});
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeSheet();});
document.getElementById('back').addEventListener('click',()=>{Snd.ui();GameMan.toMenu();});
document.getElementById('retry').addEventListener('click',()=>{Snd.ui();GameMan.retry();});
document.getElementById('menuBtn').addEventListener('click',()=>{Snd.ui();GameMan.toMenu();});
document.getElementById('cv').addEventListener('contextmenu',e=>e.preventDefault());

if(window.Telegram?.WebApp){
  try{
    const tg=window.Telegram.WebApp;
    tg.ready();tg.expand();
    if(tg.initDataUnsafe?.user){
      const u=tg.initDataUnsafe.user;
      const p=DB.get('profile');
      if(!p.name||p.name==='بازیکن')p.name=[u.first_name,u.last_name].filter(Boolean).join(' ')||'بازیکن';
      if(!p.avatar&&u.photo_url)p.avatar=u.photo_url;
      DB.save();renderUser();
    }
  }catch(e){console.warn('[Telegram] Init failed:',e.message);}
}
