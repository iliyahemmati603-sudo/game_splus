<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Galactic Arena | Ultimate</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
--bg:#07080d;--panel:#12141c;--glass:rgba(18,20,28,0.88);--text:#fff;--muted:#8b8c94;
--blue:#00f0ff;--pink:#ff0055;--gold:#ffb800;--green:#00ff88;--border:rgba(255,255,255,0.08);
--shadow:0 0 20px rgba(0,240,255,0.12);--font:Tahoma,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--font);-webkit-tap-highlight-color:transparent;user-select:none;outline:none}
body{background:var(--bg);background-image:radial-gradient(circle at 50% 0%,#151b2e 0%,#07080d 80%);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;line-height:1.5}
.header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:rgba(7,8,13,0.95);border-bottom:1px solid var(--border);backdrop-filter:blur(15px);z-index:100;flex-shrink:0}
.user-info{display:flex;align-items:center;gap:12px}
.avatar{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--blue),var(--pink));display:flex;justify-content:center;align-items:center;font-weight:900;font-size:18px;color:#fff;box-shadow:0 0 10px rgba(0,240,255,0.3)}
.user-name{font-size:14px;font-weight:700}
.user-tag{font-size:11px;color:var(--muted)}
.wallet{background:rgba(255,184,0,0.1);border:1px solid rgba(255,184,0,0.3);padding:6px 14px;border-radius:12px;display:flex;align-items:center;gap:6px;font-size:15px;font-weight:900;color:var(--gold)}
.main-content{flex:1;overflow-y:auto;padding:16px;padding-bottom:80px;scrollbar-width:none}
.main-content::-webkit-scrollbar{display:none}
.tab-pane{display:none;animation:slideUp 0.3s ease}
.tab-pane.active{display:block}
@keyframes slideUp{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
.section-title{font-size:16px;font-weight:900;margin-bottom:16px;display:flex;align-items:center;gap:8px}
.section-title::before{content:'';width:4px;height:18px;background:var(--pink);border-radius:2px;box-shadow:0 0 8px var(--pink)}
.games-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.game-card{background:var(--glass);border:1px solid var(--border);border-radius:16px;padding:18px 12px;display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;transition:all 0.2s ease;backdrop-filter:blur(10px)}
.game-card:active{transform:scale(0.95);border-color:var(--blue);box-shadow:var(--shadow)}
.game-icon{font-size:38px;margin-bottom:8px;filter:drop-shadow(0 0 8px rgba(255,255,255,0.1))}
.game-title{font-size:13px;font-weight:900;margin-bottom:4px}
.game-desc{font-size:10px;color:var(--muted);line-height:1.4}
.game-tag{font-size:9px;color:var(--blue);background:rgba(0,240,255,0.1);padding:2px 8px;border-radius:6px;margin-top:6px}
.bottom-nav{position:fixed;bottom:0;width:100%;height:65px;background:rgba(7,8,13,0.98);border-top:1px solid var(--border);display:flex;justify-content:space-around;align-items:center;backdrop-filter:blur(15px);z-index:1000}
.nav-btn{background:none;border:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:bold;cursor:pointer;padding:8px 12px;border-radius:12px;transition:0.2s}
.nav-btn.active{color:var(--blue);background:rgba(0,240,255,0.1)}
.nav-icon{font-size:20px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.92);backdrop-filter:blur(10px);z-index:2000;display:none;justify-content:center;align-items:center;padding:16px}
.modal.active{display:flex}
.modal-box{background:var(--panel);border:1px solid var(--blue);border-radius:20px;width:100%;max-width:420px;padding:20px;position:relative;box-shadow:0 0 40px rgba(0,240,255,0.15);max-height:90vh;overflow-y:auto}
.close-modal{position:absolute;top:15px;right:15px;background:rgba(255,0,85,0.1);border:none;color:var(--pink);width:30px;height:30px;border-radius:50%;font-size:18px;font-weight:bold;cursor:pointer;display:flex;justify-content:center;align-items:center}
.modal-title{font-size:18px;font-weight:900;color:var(--blue);text-align:center;margin-bottom:8px}
.modal-desc{font-size:12px;color:var(--muted);text-align:center;margin-bottom:16px}
.btn{width:100%;padding:12px;border:2px solid var(--blue);background:transparent;color:var(--blue);border-radius:12px;font-weight:900;font-size:14px;cursor:pointer;transition:0.2s;margin-top:8px}
.btn:active{background:rgba(0,240,255,0.1);transform:scale(0.98)}
.btn-pink{border-color:var(--pink);color:var(--pink)}
.btn-pink:active{background:rgba(255,0,85,0.1)}
.btn-gold{border-color:var(--gold);color:var(--gold)}
.btn-gold:active{background:rgba(255,184,0,0.1)}
.input-box{width:100%;padding:12px;border-radius:10px;border:1px solid var(--border);background:rgba(0,0,0,0.5);color:var(--text);font-size:14px;margin-bottom:8px;outline:none}
.chat-container{display:flex;flex-direction:column;height:calc(100vh - 200px);background:var(--glass);border:1px solid var(--border);border-radius:16px;overflow:hidden}
.chat-header{padding:12px 16px;background:rgba(0,0,0,0.3);border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.chat-title{font-size:14px;font-weight:900;color:var(--blue)}
.chat-messages{flex:1;padding:16px;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.msg-bubble{max-width:80%;padding:10px 14px;border-radius:14px;font-size:13px;line-height:1.5}
.msg-mine{align-self:flex-end;background:rgba(0,240,255,0.15);border:1px solid rgba(0,240,255,0.3);border-bottom-right-radius:4px}
.msg-other{align-self:flex-start;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-bottom-left-radius:4px}
.msg-author{font-size:10px;color:var(--gold);font-weight:bold;margin-bottom:4px;display:block}
.chat-input-area{padding:12px;background:rgba(0,0,0,0.3);border-top:1px solid var(--border);display:flex;gap:8px}
.chat-input{flex:1;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:12px;padding:12px 16px;color:var(--text);font-size:13px}
.chat-send-btn{background:var(--blue);color:#000;border:none;border-radius:12px;padding:0 20px;font-weight:900;font-size:14px;cursor:pointer}
.game-area{width:100%;height:250px;background:rgba(0,0,0,0.5);border:1px solid var(--border);border-radius:16px;position:relative;overflow:hidden;margin-bottom:16px}
.profile-card{background:var(--glass);border:1px solid var(--border);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:16px}
.profile-row{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(255,255,255,0.05);padding-bottom:10px;font-size:14px}
.profile-row:last-child{border-bottom:none;padding-bottom:0}
.profile-label{color:var(--muted)}
.profile-value{font-weight:900}
.text-gold{color:var(--gold)}.text-blue{color:var(--blue)}.text-green{color:var(--green)}.text-pink{color:var(--pink)}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--panel);border:2px solid var(--green);color:var(--green);padding:12px 24px;border-radius:12px;font-weight:900;font-size:14px;z-index:5000;transition:transform 0.3s cubic-bezier(0.175,0.885,0.32,1.275);box-shadow:0 0 20px rgba(0,255,136,0.2)}
.toast.show{transform:translateX(-50%) translateY(0)}
.mine-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:16px}
.mine-cell{aspect-ratio:1;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:10px;display:flex;justify-content:center;align-items:center;font-size:22px;cursor:pointer;transition:0.2s}
.mine-cell.diamond{background:rgba(0,255,136,0.15);border-color:var(--green)}
.mine-cell.bomb{background:rgba(255,0,85,0.2);border-color:var(--pink)}
.spin-wheel{display:flex;flex-direction:column;align-items:center;justify-content:center;height:180px;margin-bottom:16px}
.bottle-icon{font-size:80px;transition:transform 1.5s cubic-bezier(0.175,0.885,0.32,1.275)}
.guild-card{background:var(--glass);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.guild-info h4{font-size:14px;font-weight:900;color:var(--blue);margin-bottom:4px}
.guild-info p{font-size:11px;color:var(--muted)}
.guild-member-count{font-size:12px;color:var(--gold);font-weight:bold}
.difficulty-selector{display:flex;gap:8px;margin-bottom:12px}
.diff-btn{flex:1;padding:10px;border:1px solid var(--border);background:transparent;color:var(--muted);border-radius:10px;font-size:12px;font-weight:bold;cursor:pointer;transition:0.2s}
.diff-btn.active{background:rgba(0,240,255,0.1);border-color:var(--blue);color:var(--blue)}
.diff-btn:active{transform:scale(0.96)}
</style>
</head>
<body>

<div id="toast" class="toast"></div>

<div class="header">
<div class="user-info">
<div class="avatar" id="ui-avatar">G</div>
<div>
<div class="user-name" id="ui-name">در حال اتصال...</div>
<div class="user-tag" id="ui-tag">Galactic Arena</div>
</div>
</div>
<div class="wallet"><span>💎</span><span id="ui-coins">0</span></div>
</div>

<div class="main-content">

<div id="tab-games" class="tab-pane active">
<div class="section-title">بازی‌های کهکشانی (۱۵ بازی)</div>
<div class="games-grid" id="games-grid"></div>
</div>

<div id="tab-chat" class="tab-pane">
<div class="chat-container">
<div class="chat-header">
<div class="chat-title" id="chat-room-title">اتاق گفتگوی عمومی</div>
<div style="font-size:10px;color:var(--text-secondary)">آنلاین</div>
</div>
<div class="chat-messages" id="chat-messages"></div>
<div class="chat-input-area">
<input type="text" id="chat-input" class="chat-input" placeholder="پیام خود را بنویسید..." onkeydown="if(event.key==='Enter')sendMessage()">
<button class="chat-send-btn" onclick="sendMessage()">ارسال</button>
</div>
</div>
</div>

<div id="tab-guild" class="tab-pane">
<div class="section-title">اتحادیه کهکشانی</div>
<div id="guild-setup">
<input type="text" id="guild-name-input" class="input-box" placeholder="نام اتحادیه خود را وارد کنید...">
<button class="btn" onclick="createGuild()">ایجاد اتحادیه</button>
<button class="btn btn-pink" onclick="searchGuild()">جستجوی اتحادیه</button>
</div>
<div id="guild-room" style="display:none">
<div class="guild-card">
<div class="guild-info">
<h4 id="guild-display-name"></h4>
<p>اعضا: <span id="guild-member-count">1</span></p>
</div>
<button class="btn btn-pink" style="width:auto;padding:8px 16px;margin:0" onclick="leaveGuild()">خروج</button>
</div>
<div class="chat-container" style="height:calc(100vh - 320px)">
<div class="chat-header"><div class="chat-title">چت اتحادیه</div></div>
<div class="chat-messages" id="guild-chat-messages"></div>
<div class="chat-input-area">
<input type="text" id="guild-chat-input" class="chat-input" placeholder="پیام به اتحادیه..." onkeydown="if(event.key==='Enter')sendGuildMessage()">
<button class="chat-send-btn" onclick="sendGuildMessage()">ارسال</button>
</div>
</div>
</div>
</div>

<div id="tab-leaderboard" class="tab-pane">
<div class="section-title">برترین‌های جهان</div>
<div id="leaderboard-list"></div>
</div>

<div id="tab-profile" class="tab-pane">
<div class="section-title">پروفایل کاربری</div>
<div class="profile-card">
<div class="profile-row"><span class="profile-label">مجموع سکه‌ها:</span><span class="profile-value text-gold" id="prof-coins">0</span></div>
<div class="profile-row"><span class="profile-label">بازی‌های انجام شده:</span><span class="profile-value text-blue" id="prof-plays">0</span></div>
<div class="profile-row"><span class="profile-label">رکورد موشک:</span><span class="profile-value text-green" id="prof-rocket">0</span></div>
<div class="profile-row"><span class="profile-label">اتحادیه:</span><span class="profile-value text-pink" id="prof-guild">ندارد</span></div>
<div class="profile-row"><span class="profile-label">وضعیت:</span><span class="profile-value text-green">متصل به سروش پلاس</span></div>
</div>
</div>

</div>

<div class="bottom-nav">
<button class="nav-btn active" onclick="switchTab('games',this)"><span class="nav-icon">🎮</span><span>بازی‌ها</span></button>
<button class="nav-btn" onclick="switchTab('chat',this)"><span class="nav-icon">💬</span><span>چت</span></button>
<button class="nav-btn" onclick="switchTab('guild',this)"><span class="nav-icon">🛡️</span><span>اتحادیه</span></button>
<button class="nav-btn" onclick="switchTab('leaderboard',this)"><span class="nav-icon">🏆</span><span>رتبه</span></button>
<button class="nav-btn" onclick="switchTab('profile',this)"><span class="nav-icon">👤</span><span>پروفایل</span></button>
</div>

<div class="modal" id="game-modal">
<div class="modal-box">
<button class="close-modal" onclick="closeGame()">×</button>
<div class="modal-title" id="modal-game-title"></div>
<div class="modal-desc" id="modal-game-desc"></div>
<div id="modal-game-content"></div>
</div>
</div>

<script>
const DB_KEY='GalacticArenaUltimate_v1';
const CHAT_CHANNEL=new BroadcastChannel('GalacticArena_Chat');
const GUILD_CHANNEL=new BroadcastChannel('GalacticArena_Guild');

let State={coins:0,plays:0,rocketHighScore:0,guild:null,username:'کاربر'};
let ChatMessages=[];
let GuildMessages=[];
let gameLoop=null;
let currentGameType=null;

function loadData(){
try{
const saved=localStorage.getItem(DB_KEY);
if(saved)State=JSON.parse(saved);
const savedChat=localStorage.getItem(DB_KEY+'_chat');
if(savedChat)ChatMessages=JSON.parse(savedChat);
const savedGuildChat=localStorage.getItem(DB_KEY+'_guildchat');
if(savedGuildChat)GuildMessages=JSON.parse(savedGuildChat);
}catch(e){}
}

function saveData(){
localStorage.setItem(DB_KEY,JSON.stringify(State));
localStorage.setItem(DB_KEY+'_chat',JSON.stringify(ChatMessages));
localStorage.setItem(DB_KEY+'_guildchat',JSON.stringify(GuildMessages));
updateUI();
}

function updateUI(){
document.getElementById('ui-coins').innerText=State.coins;
document.getElementById('prof-coins').innerText=State.coins;
document.getElementById('prof-plays').innerText=State.plays;
document.getElementById('prof-rocket').innerText=State.rocketHighScore;
document.getElementById('prof-guild').innerText=State.guild||'ندارد';
}

function toast(msg){
const t=document.getElementById('toast');
t.innerText=msg;t.classList.add('show');
setTimeout(()=>t.classList.remove('show'),2000);
}

function initTelegram(){
const tg=window.Telegram?.WebApp;
if(tg&&tg.initDataUnsafe?.user){
const user=tg.initDataUnsafe.user;
State.username=user.first_name;
document.getElementById('ui-name').innerText=user.first_name;
document.getElementById('ui-avatar').innerText=user.first_name.charAt(0).toUpperCase();
if(user.username)document.getElementById('ui-tag').innerText='@'+user.username;
tg.ready();tg.expand();
}else{
State.username='کاربر مهمان';
document.getElementById('ui-name').innerText='کاربر مهمان';
document.getElementById('ui-avatar').innerText='?';
}
}

function switchTab(tabId,btn){
document.querySelectorAll('.tab-pane').forEach(el=>el.classList.remove('active'));
document.querySelectorAll('.nav-btn').forEach(el=>el.classList.remove('active'));
document.getElementById('tab-'+tabId).classList.add('active');
btn.classList.add('active');
if(tabId==='chat')renderChat();
if(tabId==='guild')renderGuild();
if(tabId==='leaderboard')renderLeaderboard();
}

function renderChat(){
const box=document.getElementById('chat-messages');
if(!box)return;
box.innerHTML=ChatMessages.map(m=>`
<div class="msg-bubble ${m.mine?'msg-mine':'msg-other'}">
<span class="msg-author">${m.author}</span>
<div>${m.text}</div>
</div>`).join('');
box.scrollTop=box.scrollHeight;
}

function sendMessage(){
const input=document.getElementById('chat-input');
const text=input.value.trim();
if(!text)return;
const msg={author:State.username,text:text,mine:true,ts:Date.now()};
ChatMessages.push(msg);
input.value='';
saveData();
renderChat();
try{CHAT_CHANNEL.postMessage(msg);}catch(e){}
}

CHAT_CHANNEL.onmessage=(e)=>{
const msg=e.data;
if(!msg||msg.author===State.username)return;
ChatMessages.push({...msg,mine:false});
saveData();
renderChat();
};

function renderGuild(){
if(!State.guild){
document.getElementById('guild-setup').style.display='block';
document.getElementById('guild-room').style.display='none';
return;
}
document.getElementById('guild-setup').style.display='none';
document.getElementById('guild-room').style.display='block';
document.getElementById('guild-display-name').innerText=State.guild;
renderGuildChat();
}

function createGuild(){
const name=document.getElementById('guild-name-input').value.trim();
if(!name)return toast('نام اتحادیه را وارد کنید');
State.guild=name;
saveData();
renderGuild();
toast('اتحادیه ساخته شد!');
}

function searchGuild(){
const name=document.getElementById('guild-name-input').value.trim();
if(!name)return toast('نام اتحادیه را وارد کنید');
State.guild=name;
saveData();
renderGuild();
toast('به اتحادیه '+name+' پیوستید!');
}

function leaveGuild(){
State.guild=null;
saveData();
renderGuild();
}

function renderGuildChat(){
const box=document.getElementById('guild-chat-messages');
if(!box)return;
box.innerHTML=GuildMessages.map(m=>`
<div class="msg-bubble ${m.mine?'msg-mine':'msg-other'}">
<span class="msg-author">${m.author}</span>
<div>${m.text}</div>
</div>`).join('');
box.scrollTop=box.scrollHeight;
}

function sendGuildMessage(){
const input=document.getElementById('guild-chat-input');
const text=input.value.trim();
if(!text||!State.guild)return;
const msg={author:State.username,text:text,mine:true,ts:Date.now(),guild:State.guild};
GuildMessages.push(msg);
input.value='';
saveData();
renderGuildChat();
try{GUILD_CHANNEL.postMessage(msg);}catch(e){}
}

GUILD_CHANNEL.onmessage=(e)=>{
const msg=e.data;
if(!msg||msg.author===State.username||msg.guild!==State.guild)return;
GuildMessages.push({...msg,mine:false});
saveData();
renderGuildChat();
};

function renderLeaderboard(){
const botScores=[
{name:'👑 GalacticLord',score:1250420},
{name:'🥈 CryptoKing',score:982100},
{name:'🥉 NeonBlade',score:850100},
{name:'GhostRider',score:615200},
{name:'AlphaWolf',score:412100},
{name:'CyberPunk',score:288100}
];
let html=botScores.map((b,i)=>`
<div class="profile-row" style="border-right:3px solid ${i===0?'var(--gold)':i===1?'#c0c0c0':'#cd7f32'}">
<span style="font-weight:bold">${b.name}</span>
<span style="color:var(--gold);font-weight:900">${b.score.toLocaleString()}</span>
</div>`).join('');
html+=`
<div class="profile-row" style="border-right:3px solid var(--blue);background:rgba(0,240,255,0.05)">
<span style="font-weight:bold">شما</span>
<span style="color:var(--blue);font-weight:900">${State.coins.toLocaleString()}</span>
</div>`;
document.getElementById('leaderboard-list').innerHTML=html;
}

const gamesList=[
{id:'rocket',icon:'🚀',name:'سفر موشک',tag:'سرعتی',desc:'با کشیدن انگشت از سیارک‌ها فرار کن!'},
{id:'mines',icon:'💣',name:'مین‌یاب',tag:'شانسی',desc:'الماس پیدا کن و از بمب دوری کن.'},
{id:'bottle',icon:'🍾',name:'چرخ حقیقت',tag:'اجتماعی',desc:'بطری رو بچرخون، حقیقت یا جرات!'},
{id:'ttt',icon:'⭕',name:'دوز',tag:'PvP',desc:'در برابر ربات یا دوستت بازی کن.'},
{id:'rps',icon:'✊',name:'سنگ کاغذ',tag:'PvP',desc:'در برابر ربات با سطح سختی.'},
{id:'memory',icon:'🧠',name:'حافظه',tag:'فکری',desc:'کارت‌های همسان را پیدا کن.'},
{id:'math',icon:'🧮',name:'ریاضی',tag:'فکری',desc:'به سوالات ریاضی پاسخ بده.'},
{id:'reaction',icon:'⚡',name:'واکنش',tag:'سرعتی',desc:'به محض سبز شدن کلیک کن!'},
{id:'target',icon:'🎯',name:'هدف',tag:'دقت',desc:'اهداف را در زمان محدود بزن.'},
{id:'higher',icon:'🃏',name:'بالا/پایین',tag:'شانسی',desc:'حدس بزن عدد بعدی بالاتر است یا پایین‌تر.'},
{id:'color',icon:'🎨',name:'تطبیق رنگ',tag:'فکری',desc:'رنگ نوشته را تشخیص بده.'},
{id:'clicker',icon:'👆',name:'کلیکر',tag:'سرعتی',desc:'در ۱۰ ثانیه هرچه می‌توانی کلیک کن.'},

function setupTTT(container){
container.innerHTML=`

<button class="btn btn-pink" onclick="setupTTT(document.getElementById('modal-game-content'))">شروع مجدد</button>`;

let board=['','','','','','','','',''];
let gameOver=false;
let aiDifficulty='easy';

window.setDiff=function(btn,level){
document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
aiDifficulty=level;
};

function renderBoard(){
const b=document.getElementById('ttt-board');
b.innerHTML='';
board.forEach((cell,i)=>{
const c=document.createElement('div');
c.style.cssText='aspect-ratio:1;display:flex;justify-content:center;align-items:center;font-size:32px;font-weight:bold;cursor:pointer;background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:8px';
c.innerText=cell;
c.style.color=cell==='X'?'var(--blue)':cell==='O'?'var(--pink)':'var(--text)';
c.onclick=()=>playerMove(i);
b.appendChild(c);
});
}

function checkWin(b){
const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
for(const w of wins){
if(b[w[0]]&&b[w[0]]===b[w[1]]&&b[w[1]]===b[w[2]])return b[w[0]];
}
return b.includes('')?null:'draw';
}

function playerMove(i){
if(board[i]||gameOver)return;
board[i]='X';
renderBoard();
const win=checkWin(board);
if(win){gameOver=true;document.getElementById('ttt-status').innerText=win==='X'?'شما بردید!':'مساوی!';return;}
document.getElementById('ttt-status').innerText='نوبت ربات...';
setTimeout(aiMove,300);
}

function aiMove(){
if(gameOver)return;
const empty=board.map((c,i)=>c?'':i).filter(c=>c!=='');
if(!empty.length)return;

let move;
if(aiDifficulty==='easy'){
move=empty[Math.floor(Math.random()*empty.length)];
}else if(aiDifficulty==='medium'){
const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let found=false;
for(const w of wins){
const line=w.map(i=>board[i]);
if(line.filter(c=>c==='O').length===2&&line.includes('')){
move=w[line.indexOf('')];found=true;break;
}
}
if(!found)for(const w of wins){
const line=w.map(i=>board[i]);
if(line.filter(c=>c==='X').length===2&&line.includes('')){
move=w[line.indexOf('')];found=true;break;
}
}
if(!found)move=empty[Math.floor(Math.random()*empty.length)];
}else{
const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let bestScore=-Infinity;
for(const idx of empty){
board[idx]='O';
const score=minimax(board,0,false);
board[idx]='';
if(score>bestScore){bestScore=score;move=idx;}
}
}
if(move===undefined)move=empty[0];
board[move]='O';
renderBoard();
const win=checkWin(board);
if(win){
gameOver=true;
if(win==='O'){
document.getElementById('ttt-status').innerText='ربات برد!';
}else if(win==='draw'){
document.getElementById('ttt-status').innerText='مساوی!';
}else{
document.getElementById('ttt-status').innerText='شما بردید!';
State.coins+=20;saveData();
}
}else{
document.getElementById('ttt-status').innerText='نوبت شما (X)';
}
}

function minimax(b,depth,isMax){
const win=checkWin(b);
if(win==='O')return 10-depth;
if(win==='X')return depth-10;
if(win==='draw')return 0;
const empty=b.map((c,i)=>c?'':i).filter(c=>c!=='');
if(isMax){
let best=-Infinity;
for(const idx of empty){
b[idx]='O';
best=Math.max(best,minimax(b,depth+1,false));
b[idx]='';
}
return best;
}else{
let best=Infinity;
for(const idx of empty){
b[idx]='X';
best=Math.min(best,minimax(b,depth+1,true));
b[idx]='';
}
return best;
}
}

renderBoard();
}

container.innerHTML=`

<button class="btn" onclick="playRPS('✌️')" style="font-size:30px">✌️</button>
</div>

let wins=0,losses=0;
let rpsDiff='easy';

window.setRPSDiff=function(btn,level){
document.querySelectorAll('#modal-game-content .diff-btn').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
rpsDiff=level;
};

window.playRPS=function(choice){
let botChoice;
if(rpsDiff==='easy'){
botChoice=['✊','✋','✌️'][Math.floor(Math.random()*3)];
}else if(rpsDiff==='medium'){
const weights={'✊':1,'✋':1,'✌️':1};
if(wins>losses)weights['✊']=2;
else if(losses>wins)weights['✋']=2;
const pool=[];
for(const k in weights)for(let i=0;i<weights[k];i++)pool.push(k);
botChoice=pool[Math.floor(Math.random()*pool.length)];
}else{
if(choice==='✊')botChoice='✋';
else if(choice==='✋')botChoice='✌️';
else botChoice='✊';
if(Math.random()<0.2)botChoice=['✊','✋','✌️'][Math.floor(Math.random()*3)];
}

const result=document.getElementById('rps-result');
if(choice===botChoice){
result.innerText='مساوی! ('+botChoice+')';
result.style.color='var(--muted)';
}else if((choice==='✊'&&botChoice==='✌️')||(choice==='✋'&&botChoice==='✊')||(choice==='✌️'&&botChoice==='✋')){
result.innerText='بردی! ('+botChoice+')';
result.style.color='var(--green)';
wins++;State.coins+=10;saveData();
}else{
result.innerText='باختی! ('+botChoice+')';
result.style.color='var(--pink)';
losses++;
}
document.getElementById('rps-score').innerText='برد: '+wins+' | باخت: '+losses;
};
}

let t=10,s=0;
document.getElementById('c-t').onclick=function(){
if(t>0){s++;State.coins+=1;saveData();document.getElementById('c-s').innerText='امتیاز: '+s;}
};
gameLoop=setInterval(()=>{
t--;
document.getElementById('c-tt').innerText=t;
if(t<=0){clearInterval(gameLoop);toast('پایان!');setTimeout(closeGame,1000);}
},1000);
}

function setupWord(container){
const words=['برنامه','اینترنت','تلگرام','دیتابیس','امنیت','شبکه','کامپیوتر'];
const target=words[Math.floor(Math.random()*words.length)];
container.innerHTML=`
<h2 style="font-size:30px;letter-spacing:6px;margin:16px 0;color:var(--gold);text-align:center">${target.split('').sort(()=>Math.random()-0.5).join('')}</h2>
<input type="text" id="w-i" class="input-box" placeholder="کلمه صحیح...">
<button class="btn" onclick="checkWord('${target}')">تایید</button>`;
window.checkWord=function(w){
if(document.getElementById('w-i').value===w){
State.coins+=50;saveData();
toast('درست بود! +50');
setTimeout(closeGame,1000);
}else{
toast('اشتباه بود!');
}
};
}

function setupWheel(container){
container.innerHTML=`
<div style="font-size:80px;margin:16px 0;text-align:center;transition:transform 0.8s" id="w-v">🎡</div>
<button class="btn btn-gold" onclick="spinWheel()">چرخاندن (۵۰ سکه)</button>
<div id="w-result" style="text-align:center;margin-top:16px;font-weight:bold;min-height:30px"></div>`;
window.spinWheel=function(){
if(State.coins<50)return toast('سکه کافی نیست!');
State.coins-=50;saveData();
document.getElementById('w-v').style.transform='rotate('+(Math.random()*720+720)+'deg)';
setTimeout(()=>{
const w=Math.floor(Math.random()*200)+10;
State.coins+=w;saveData();
document.getElementById('w-result').innerText='بردی! +'+w;
},800);
};
}

function setupMiner(container){
container.innerHTML=`
<div style="font-size:70px;margin:16px 0;text-align:center;transition:transform 0.1s" id="rock">🪨</div>
<div class="progress-bar"><div class="progress-fill" id="mine-bar"></div></div>
<button class="btn" style="margin-top:16px" onclick="digMine()">حفاری</button>`;
window.digMine=function(){
const bar=document.getElementById('mine-bar');
let p=0;
document.getElementById('rock').style.transform='rotate(15deg) translateY(4px)';
setTimeout(()=>document.getElementById('rock').style.transform='rotate(0deg) translateY(0)',100);
const int=setInterval(()=>{
p+=20;bar.style.width=p+'%';
if(p>=100){
clearInterval(int);
bar.style.width='0%';
const loot=Math.floor(Math.random()*50)+10;
State.coins+=loot;saveData();
toast('سنگ پیدا کردی! +'+loot);
}
},100);
};
}

loadData();
initTelegram();
updateUI();
renderGames();
renderChat();
renderLeaderboard();
</script>
</body>
</html>
