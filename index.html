<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0e1a">
<title>NEXUS ARCADE — 21 Mini Games</title>
<style>
:root{--bg:#060912;--cyan:#00e5ff;--pink:#ff2d78;--gold:#ffc531;--green:#2bff88;--purple:#a855f7;--text:#e8f4ff;--muted:#5f7a99;--border:rgba(0,229,255,.16);--st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:Tahoma,system-ui,sans-serif;touch-action:none;position:fixed;overscroll-behavior:none}
#menu{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;padding:14px 12px calc(22px + var(--sb));overflow-y:auto;background:radial-gradient(ellipse 80% 50% at 50% -10%,rgba(0,229,255,.14),transparent 60%),radial-gradient(ellipse 70% 50% at 50% 110%,rgba(168,85,247,.1),transparent 60%),var(--bg)}
#menu::-webkit-scrollbar{width:0}
.brand{text-align:center;margin:2px 0 12px}
.brand h1{font-size:clamp(22px,6.5vw,38px);font-weight:900;letter-spacing:1.5px;background:linear-gradient(90deg,var(--cyan),#7dd3fc,var(--purple),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(0,229,255,.4));line-height:1.2}
.brand p{margin-top:3px;font-size:10px;color:var(--muted)}
.topbar{display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap;margin-bottom:10px;width:100%;max-width:900px}
.uchip{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:999px;padding:4px 10px 4px 4px;cursor:pointer}
.av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--purple));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;color:#031018;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.uname{font-size:11px;font-weight:700;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{background:rgba(255,255,255,.035);border:1px solid var(--border);border-radius:999px;padding:4px 11px;font-size:10px;color:var(--muted);display:flex;align-items:center;gap:4px;cursor:pointer}
.chip b{color:var(--text);font-size:11px}
.stats{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:900px;padding-bottom:20px}
@media(min-width:560px){.grid{grid-template-columns:repeat(4,1fr);gap:10px}}
@media(min-width:860px){.grid{grid-template-columns:repeat(5,1fr)}}
.card{background:linear-gradient(160deg,#131f36,#0a0f1c);border:1px solid var(--border);border-radius:14px;padding:11px 5px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;position:relative;overflow:hidden;min-height:88px;justify-content:center;transition:transform .1s}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--accent,#00e5ff),transparent);opacity:.7}
.card:active{transform:scale(.93);border-color:var(--cyan)}
.card .ic{font-size:23px}
.card .nm{font-size:10px;font-weight:700;text-align:center;line-height:1.2}
.card .ds{font-size:8px;color:var(--muted);text-align:center}
.card .bs{font-size:8px;color:var(--gold)}
#game{position:absolute;inset:0;z-index:10;display:none}
#game.on{display:block}
#cv{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;top:0;left:0;right:0;padding:calc(5px + var(--st)) 7px 5px;display:flex;gap:4px;flex-wrap:wrap;justify-content:center;pointer-events:none;z-index:12}
.pill{background:rgba(6,10,20,.8);border:1px solid rgba(0,229,255,.24);border-radius:999px;padding:3px 10px;font-size:10px;color:#bfe9ff;white-space:nowrap;display:flex;align-items:center;gap:3px}
.pill b{color:#fff;font-size:11px}
#back{position:absolute;top:calc(7px + var(--st));right:7px;z-index:30;width:36px;height:36px;border-radius:50%;border:1px solid rgba(0,229,255,.3);background:rgba(5,8,16,.82);color:var(--cyan);font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#console-btn{position:absolute;top:calc(7px + var(--st));right:50px;z-index:30;width:36px;height:36px;border-radius:50%;border:1px solid rgba(255,197,49,.4);background:rgba(5,8,16,.82);color:var(--gold);font-size:15px;display:flex;align-items:center;justify-content:center;cursor:pointer}
#console-panel{position:absolute;top:calc(48px + var(--st));right:7px;left:7px;z-index:35;max-height:50vh;background:rgba(2,4,8,.97);border:1px solid rgba(255,197,49,.3);border-radius:12px;display:none;flex-direction:column;overflow:hidden;font-family:monospace}
#console-panel.show{display:flex}
#console-header{padding:6px 10px;background:rgba(255,197,49,.1);border-bottom:1px solid rgba(255,197,49,.2);display:flex;justify-content:space-between;align-items:center;font-size:10px;color:var(--gold)}
#console-body{padding:6px 8px;overflow-y:auto;font-size:9px;line-height:1.5;direction:ltr;text-align:left;max-height:42vh}
#console-body::-webkit-scrollbar{width:3px}
#console-body::-webkit-scrollbar-thumb{background:var(--gold);border-radius:2px}
.log-line{padding:1px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.log-error{color:#ff2d78}
.log-warn{color:#ffc531}
.log-info{color:#00e5ff}
#over{position:absolute;inset:0;z-index:40;display:none;flex-direction:column;align-items:center;justify-content:center;gap:9px;padding:20px;background:rgba(2,4,8,.94);text-align:center}
#over.show{display:flex}
#over .bd{font-size:8px;letter-spacing:3px;color:var(--muted)}
#over h2{font-size:clamp(20px,5.5vw,30px);font-weight:900;color:var(--pink);text-shadow:0 0 22px rgba(255,45,120,.5)}
#over .sc{font-size:26px;font-weight:900;color:var(--gold)}
#over .sb{font-size:11px;color:var(--muted);line-height:1.6}
#over .sb b{color:var(--text)}
.acts{display:flex;flex-direction:column;gap:7px;width:100%;max-width:250px}
.btn{width:100%;padding:11px 16px;border-radius:11px;border:none;font-size:13px;font-weight:800;font-family:inherit;cursor:pointer;background:linear-gradient(135deg,#00e5ff,#0090d0);color:#031018}
.btn.g{background:transparent;border:1px solid rgba(0,229,255,.3);color:var(--cyan);font-size:12px}
#modal{position:absolute;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.65);padding:0}
#modal.show{display:flex}
.sheet{background:linear-gradient(180deg,#0d1628,#080d18);border-radius:22px 22px 0 0;border-top:1px solid rgba(0,229,255,.2);width:100%;max-width:480px;max-height:88vh;overflow-y:auto;padding:18px 16px calc(16px + var(--sb));animation:su .22s ease;position:relative}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet::-webkit-scrollbar{width:0}
.sheet h3{font-size:16px;font-weight:900;margin-bottom:12px;color:var(--cyan);text-align:center}
.sheet label{display:block;font-size:11px;color:var(--muted);margin:10px 0 4px}
.sheet input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:rgba(255,255,255,.04);color:#fff;font-size:13px;font-family:inherit;outline:none}
.tgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:6px}
.tsw{aspect-ratio:1;border-radius:10px;border:2px solid transparent;cursor:pointer}
.tsw.on{border-color:#fff;box-shadow:0 0 12px rgba(255,255,255,.4)}
.lb-row{display:flex;align-items:center;gap:9px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.025);margin-bottom:5px;border:1px solid transparent}
.lb-row.me{border-color:rgba(0,229,255,.3);background:rgba(0,229,255,.06)}
.lb-rank{font-size:13px;font-weight:900;width:26px;text-align:center;color:var(--muted)}
.lb-rank.t1{color:var(--gold)}.lb-rank.t2{color:#c0c8d4}.lb-rank.t3{color:#cd7f32}
.lb-av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--cyan),var(--purple));display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#031018;overflow:hidden;flex-shrink:0}
.lb-av img{width:100%;height:100%;object-fit:cover}
.lb-info{flex:1;min-width:0}
.lb-name{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-sub{font-size:9px;color:var(--muted)}
.lb-sc{font-size:13px;font-weight:900;color:var(--gold)}
.close-x{position:absolute;top:10px;left:12px;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.06);border:none;color:var(--muted);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.dpad{position:absolute;bottom:calc(18px + var(--sb));left:50%;transform:translateX(-50%);z-index:25;display:none;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:3px;pointer-events:none}
.dpad.on{display:grid}
.dpad button{pointer-events:auto;width:54px;height:54px;border-radius:14px;border:2px solid rgba(0,229,255,.35);background:rgba(6,12,24,.82);color:var(--cyan);font-size:18px;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 0 12px rgba(0,229,255,.15)}
.dpad button:active{background:rgba(0,229,255,.25);transform:scale(.92)}
.dpad .up{grid-column:2;grid-row:1}.dpad .left{grid-column:1;grid-row:2}.dpad .right{grid-column:3;grid-row:2}.dpad .down{grid-column:2;grid-row:3}
</style>
</head>
<body>
<div id="menu">
<div class="brand"><h1>NEXUS ARCADE</h1><p>۲۱ مینی‌گیم حرفه‌ای · Telegram Edition</p></div>
<div class="topbar">
<div class="uchip" id="userChip"><div class="av" id="userAv">?</div><div class="uname" id="userName">مهمان</div></div>
<div class="chip" id="themeChip">🎨 <b>تم</b></div>
<div class="chip" id="lbChip">🏆 <b>جدول</b></div>
</div>
<div class="stats" id="stats"></div>
<div class="grid" id="grid"></div>
</div>
<div id="game">
<canvas id="cv"></canvas>
<div id="hud"></div>
<button id="back">✕</button>
<button id="console-btn" onclick="toggleConsole()">◉</button>
<div id="console-panel">
<div id="console-header"><span>CONSOLE</span><span style="cursor:pointer" onclick="clearConsole()">CLEAR</span></div>
<div id="console-body"></div>
</div>
<div class="dpad" id="dpad">
<button class="up" data-dir="up">▲</button>
<button class="left" data-dir="left">◀</button>
<button class="right" data-dir="right">▶</button>
<button class="down" data-dir="down">▼</button>
</div>
<div id="over">
<div class="bd">GAME OVER</div>
<h2 id="o-title">بازی تمام شد</h2>
<div class="sc" id="o-score">0</div>
<div class="sb" id="o-sub"></div>
<div class="acts"><button class="btn" id="retry">تلاش مجدد</button><button class="btn g" id="menuBtn">منوی اصلی</button></div>
</div>
</div>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<script src="games.js"></script>
<script>
'use strict';
const DB={key:'nx_pro_v15',data:null,
load(){try{this.data=JSON.parse(localStorage.getItem(this.key)||'{}');}catch(e){this.data={};}
this.data.profile=this.data.profile||{name:'بازیکن',avatar:'',id:'g_'+Math.random().toString(36).slice(2,9)};
this.data.best=this.data.best||{};this.data.plays=this.data.plays||0;
this.data.theme=this.data.theme||0;this.data.leaderboard=this.data.leaderboard||[];
this.data.settings=this.data.settings||{sound:true,haptics:true};},
save(){try{localStorage.setItem(this.key,JSON.stringify(this.data));}catch(e){}},
get(k,d){return this.data[k]!==undefined?this.data[k]:d;},set(k,v){this.data[k]=v;this.save();}};
DB.load();

const THEMES=[
{name:'نئون',bg:'#060912',cyan:'#00e5ff',pink:'#ff2d78',gold:'#ffc531',green:'#2bff88',purple:'#a855f7',text:'#e8f4ff',muted:'#5f7a99',border:'rgba(0,229,255,.16)'},
{name:'نیمه‌شب',bg:'#0a0e1a',cyan:'#5eb8ff',pink:'#ff6b9d',gold:'#ffd166',green:'#6bffb8',purple:'#c084fc',text:'#eef2ff',muted:'#6b7fa8',border:'rgba(94,184,255,.18)'},
{name:'غروب',bg:'#12080a',cyan:'#ff8a65',pink:'#ff5252',gold:'#ffca28',green:'#aed581',purple:'#ba68c8',text:'#fff3e0',muted:'#8d6e63',border:'rgba(255,138,101,.2)'},
{name:'جنگل',bg:'#06120a',cyan:'#4ade80',pink:'#f472b6',gold:'#fbbf24',green:'#34d399',purple:'#a78bfa',text:'#ecfdf5',muted:'#4b7a5e',border:'rgba(74,222,128,.18)'},
{name:'اقیانوس',bg:'#020c1a',cyan:'#38bdf8',pink:'#fb7185',gold:'#fbbf24',green:'#2dd4bf',purple:'#818cf8',text:'#e0f2fe',muted:'#3a6a8a',border:'rgba(56,189,248,.18)'}];

function applyTheme(i){const t=THEMES[i]||THEMES[0];const r=document.documentElement.style;
r.setProperty('--bg',t.bg);r.setProperty('--cyan',t.cyan);r.setProperty('--pink',t.pink);
r.setProperty('--gold',t.gold);r.setProperty('--green',t.green);r.setProperty('--purple',t.purple);
r.setProperty('--text',t.text);r.setProperty('--muted',t.muted);r.setProperty('--border',t.border);DB.set('theme',i);}

const LB={list:DB.get('leaderboard',[]),
submit(g,s){const p=DB.get('profile');this.list.push({name:p.name,avatar:p.avatar,id:p.id,game:g,score:s,ts:Date.now()});
this.list.sort((a,b)=>b.score-a.score);this.list=this.list.slice(0,100);DB.set('leaderboard',this.list);
const mb=DB.get('best')||{};const r=!mb[g]||s>mb[g];if(r){mb[g]=s;DB.set('best',mb);}return r;},
top(n=20){return this.list.slice(0,n);},
myRank(){const p=DB.get('profile');const i=this.list.findIndex(e=>e.id===p.id);return i>=0?i+1:0;}};

function renderStats(){const t=Object.values(DB.get('best')||{}).reduce((a,b)=>a+b,0);
document.getElementById('stats').innerHTML=`<div class="chip">🏆 مجموع <b>${t}</b></div><div class="chip">🎮 <b>${GAME_LIST.length}</b></div><div class="chip">▶️ <b>${DB.get('plays')||0}</b></div>`;}
function renderUser(){const p=DB.get('profile');const av=document.getElementById('userAv'),nm=document.getElementById('userName');
nm.textContent=p.name||'بازیکن';if(p.avatar)av.innerHTML=`<img src="${p.avatar}" alt="">`;else av.textContent=(p.name||'?').charAt(0).toUpperCase();}
function renderMenu(){const g=document.getElementById('grid');g.innerHTML='';
for(const gm of GAME_LIST){const cd=document.createElement('div');cd.className='card';cd.style.setProperty('--accent',gm.color);
const b=(DB.get('best')||{})[gm.id]||0;
cd.innerHTML=`<div class="ic">${gm.icon}</div><div class="nm">${gm.name}</div><div class="ds">${gm.desc}</div>${b?`<div class="bs">رکورد ${b}</div>`:''}`;
cd.addEventListener('click',()=>{GameEngine.play(gm.id);});g.appendChild(cd);}
renderStats();renderUser();}
function openSheet(h){document.getElementById('sheet').innerHTML=`<button class="close-x" onclick="closeSheet()">✕</button>`+h;document.getElementById('modal').classList.add('show');}
function closeSheet(){document.getElementById('modal').classList.remove('show');}
function showProfile(){const p=DB.get('profile');
openSheet(`<h3>👤 پروفایل بازیکن</h3><label>نام نمایشی</label><input type="text" id="inp-name" value="${p.name||''}" placeholder="نام شما"><label>آدرس تصویر پروفایل</label><input type="text" id="inp-avatar" value="${p.avatar||''}" placeholder="https://..."><button class="btn" style="margin-top:14px" onclick="saveProfile()">ذخیره تغییرات</button>`);}
function saveProfile(){const n=document.getElementById('inp-name').value.trim()||'بازیکن';const a=document.getElementById('inp-avatar').value.trim();
DB.data.profile.name=n;DB.data.profile.avatar=a;DB.save();renderUser();closeSheet();}
function showThemes(){let sw='';THEMES.forEach((t,i)=>{sw+=`<div class="tsw ${i===DB.get('theme')?'on':''}" style="background:linear-gradient(135deg,${t.cyan},${t.pink});" onclick="pickTheme(${i})"></div>`;});
openSheet(`<h3>🎨 تم ظاهری</h3><div class="tgrid">${sw}</div>`);}
function pickTheme(i){applyTheme(i);closeSheet();}
function showLeaderboard(){const list=LB.top(20);const myId=DB.get('profile').id;let rows='';
if(!list.length)rows='<div style="text-align:center;color:var(--muted);padding:20px">هنوز امتیازی ثبت نشده</div>';
else list.forEach((e,i)=>{const rank=i+1;const cls=rank===1?'t1':rank===2?'t2':rank===3?'t3':'';
const me=e.id===myId?'me':'';const av=e.avatar?`<img src="${e.avatar}">`:(e.name||'?').charAt(0).toUpperCase();
const gm=GAME_LIST.find(g=>g.id===e.game);
rows+=`<div class="lb-row ${me}"><div class="lb-rank ${cls}">${rank}</div><div class="lb-av">${av}</div><div class="lb-info"><div class="lb-name">${e.name||'بازیکن'}</div><div class="lb-sub">${gm?gm.name:e.game}</div></div><div class="lb-sc">${e.score}</div></div>`;});
const mr=LB.myRank();openSheet(`<h3>🏆 جدول امتیازات</h3><div style="text-align:center;font-size:11px;color:var(--muted);margin-bottom:10px">${mr?`رتبه شما: ${mr}`:'هنوز بازی نکرده‌اید'}</div>${rows}`);}

document.getElementById('userChip').addEventListener('click',showProfile);
document.getElementById('themeChip').addEventListener('click',showThemes);
document.getElementById('lbChip').addEventListener('click',showLeaderboard);
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeSheet();});
document.getElementById('back').addEventListener('click',()=>GameEngine.toMenu());
document.getElementById('retry').addEventListener('click',()=>GameEngine.retry());
document.getElementById('menuBtn').addEventListener('click',()=>GameEngine.toMenu());
document.getElementById('cv').addEventListener('contextmenu',e=>e.preventDefault());

applyTheme(DB.get('theme')||0);
GameEngine.init({db:DB,lb:LB,renderMenu,renderUser,applyTheme,THEMES,GAME_LIST});
GameEngine.buildMenu();
</script>
</body>
</html>
