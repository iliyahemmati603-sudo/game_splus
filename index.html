<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مینی اپ سرگرمی</title>
    <style>
        body { font-family: Tahoma, sans-serif; text-align: center; padding: 50px; background: #f0f2f5; margin: 0; }
        .card { background: white; padding: 40px 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 400px; margin: auto; }
        h1 { color: #2c3e50; }
        p { color: #555; line-height: 1.6; }
        .btn { background: #007bff; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; margin-top: 20px; cursor: pointer; width: 100%; font-weight: bold;}
        .btn:active { background: #0056b3; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎉 مینی اپ فعال شد!</h1>
        <p>این سایت روی گیت‌هاب میزبانی میشه و برای همه کاملاً باز و امن است.</p>
        <button class="btn" onclick="alert('دکمه به درستی کار می‌کند!')">تست کلیک</button>
    </div>
</body>
</html>
