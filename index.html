<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Galactic Empire | Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #040408;
            --panel: rgba(18, 22, 35, 0.85);
            --primary: #00e5ff;
            --secondary: #ff0055;
            --gold: #ffcc00;
            --success: #00ff88;
            --text: #ffffff;
            --muted: #8b8b93;
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            background-image: radial-gradient(circle at 50% 0%, #1a103c 0%, #040408 80%);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(4, 4, 8, 0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            z-index: 100;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: 900;
            font-size: 20px;
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.4);
        }

        .user-details h2 {
            font-size: 14px;
            font-weight: 700;
        }

        .user-details p {
            font-size: 11px;
            color: var(--muted);
        }

        .wallet {
            text-align: left;
        }

        .wallet-title {
            font-size: 11px;
            color: var(--muted);
            display: block;
            margin-bottom: 2px;
        }

        .wallet-amount {
            font-family: 'Orbitron', sans-serif;
            font-size: 20px;
            font-weight: 900;
            color: var(--gold);
            display: flex;
            align-items: center;
            gap: 5px;
            text-shadow: 0 0 15px rgba(255, 204, 0, 0.4);
        }

        .main-container {
            flex: 1;
            overflow-y: auto;
            padding-bottom: 80px;
            scrollbar-width: none;
        }

        .main-container::-webkit-scrollbar {
            display: none;
        }

        .screen {
            display: none;
            animation: fadeIn 0.3s ease;
            height: 100%;
        }

        .screen.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .home-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            position: relative;
            padding: 20px;
        }

        .tap-circle {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(0, 229, 255, 0.15) 0%, transparent 70%);
            border: 3px solid rgba(0, 229, 255, 0.4);
            box-shadow: 0 0 60px rgba(0, 229, 255, 0.2), inset 0 0 40px rgba(0, 229, 255, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 120px;
            cursor: pointer;
            transition: transform 0.05s;
            position: relative;
        }

        .tap-circle:active {
            transform: scale(0.92);
            border-color: var(--primary);
            box-shadow: 0 0 90px var(--primary);
        }

        .floating-text {
            position: absolute;
            font-family: 'Orbitron', sans-serif;
            font-size: 28px;
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 10px var(--primary);
            pointer-events: none;
            animation: floatUp 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            z-index: 50;
        }

        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-80px) scale(1.5); }
        }

        .energy-container {
            position: absolute;
            bottom: 20px;
            width: 90%;
            max-width: 400px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 12px;
            backdrop-filter: blur(10px);
        }

        .energy-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .energy-header span:last-child {
            color: var(--gold);
        }

        .energy-bar {
            width: 100%;
            height: 12px;
            background: #1a1a24;
            border-radius: 6px;
            overflow: hidden;
        }

        .energy-fill {
            height: 100%;
            background: linear-gradient(90deg, #ffaa00, #ffdd00);
            width: 100%;
            transition: width 0.2s ease;
            box-shadow: 0 0 10px rgba(255, 170, 0, 0.5);
        }

        .games-section {
            padding: 15px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 900;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-title::before {
            content: '';
            width: 4px;
            height: 18px;
            background: var(--secondary);
            border-radius: 2px;
            box-shadow: 0 0 10px var(--secondary);
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        .game-card {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 20px 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
            overflow: hidden;
        }

        .game-card:active {
            transform: scale(0.94);
            border-color: var(--primary);
        }

        .game-icon {
            font-size: 42px;
            margin-bottom: 12px;
            filter: drop-shadow(0 0 10px rgba(255,255,255,0.2));
        }

        .game-name {
            font-size: 14px;
            font-weight: 900;
            color: #fff;
        }

        .game-tag {
            font-size: 11px;
            color: var(--muted);
            margin-top: 6px;
            background: rgba(0, 0, 0, 0.5);
            padding: 3px 10px;
            border-radius: 8px;
        }

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .modal.show {
            display: flex;
            opacity: 1;
        }

        .modal-box {
            background: var(--panel);
            width: 94%;
            max-width: 400px;
            padding: 25px;
            border-radius: 24px;
            border: 1px solid var(--primary);
            box-shadow: 0 0 50px rgba(0, 229, 255, 0.15);
            text-align: center;
            position: relative;
            max-height: 85vh;
            overflow-y: auto;
            transform: translateY(20px);
            transition: transform 0.3s;
        }

        .modal.show .modal-box {
            transform: translateY(0);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 0, 85, 0.1);
            border: none;
            color: var(--secondary);
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .modal-title {
            font-size: 22px;
            font-weight: 900;
            color: var(--primary);
            margin-bottom: 15px;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.4);
        }

        .stats-bar {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.5);
            padding: 12px 18px;
            border-radius: 14px;
            margin-bottom: 20px;
            font-size: 14px;
            border: 1px solid var(--border);
        }

        .btn {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
            padding: 14px;
            border-radius: 14px;
            font-weight: 900;
            font-size: 15px;
            width: 100%;
            margin-top: 12px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn:active {
            background: rgba(0, 229, 255, 0.15);
            transform: scale(0.97);
        }

        .btn-danger {
            border-color: var(--secondary);
            color: var(--secondary);
        }

        .btn-danger:active {
            background: rgba(255, 0, 85, 0.15);
        }

        .input-field {
            width: 100%;
            padding: 15px;
            border-radius: 14px;
            border: 2px solid rgba(0, 229, 255, 0.3);
            background: rgba(0, 0, 0, 0.6);
            color: var(--primary);
            text-align: center;
            font-size: 22px;
            margin-bottom: 12px;
            outline: none;
            font-family: 'Orbitron';
        }

        .progress-bar {
            width: 100%;
            height: 12px;
            background: #1a1a24;
            border-radius: 6px;
            overflow: hidden;
            margin-top: 15px;
            border: 1px solid var(--border);
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--success));
            width: 0%;
            transition: width 0.2s;
        }

        #toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(10, 10, 20, 0.95);
            border: 1px solid var(--success);
            color: var(--success);
            padding: 12px 25px;
            border-radius: 12px;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 2000;
            font-weight: bold;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
        }

        #toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background: rgba(10, 10, 12, 0.95);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
            background: none;
            border: none;
            color: var(--muted);
            font-size: 11px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .nav-item.active {
            color: var(--primary);
        }

        .nav-icon {
            font-size: 22px;
        }
    </style>
</head>
<body>
    <div id="toast"></div>

    <div class="header">
        <div class="user-info">
            <div class="avatar" id="user-avatar">G</div>
            <div class="user-details">
                <h2 id="user-name">کاوشگر</h2>
                <p id="user-level">سطح 1</p>
            </div>
        </div>
        <div class="wallet">
            <span class="wallet-title">موجودی شما</span>
            <div class="wallet-amount"><span id="balance-amount">0</span> 🪙</div>
        </div>
    </div>

    <div class="main-container">
        <div id="screen-home" class="screen active">
            <div class="home-screen">
                <div class="tap-circle" id="tap-area">🌌</div>
                <div class="energy-container">
                    <div class="energy-header">
                        <span id="energy-text">1000 / 1000</span>
                        <span>⚡</span>
                    </div>
                    <div class="energy-bar"><div class="energy-fill" id="energy-fill"></div></div>
                </div>
            </div>
        </div>

        <div id="screen-games" class="screen">
            <div class="games-section">
                <div class="section-title">کتابخانه بازی‌ها</div>
                <div class="games-grid" id="games-grid"></div>
            </div>
        </div>

        <div id="screen-upgrades" class="screen">
            <div class="games-section">
                <div class="section-title">ارتقا و افزایش درآمد</div>
                <div id="upgrades-container"></div>
            </div>
        </div>

        <div id="screen-leaderboard" class="screen">
            <div class="games-section">
                <div class="section-title">برترین‌های جهان</div>
                <div id="leaderboard-list"></div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('home', this)">
            <span class="nav-icon">🏠</span><span>خانه</span>
        </button>
        <button class="nav-item" onclick="switchTab('games', this)">
            <span class="nav-icon">🎮</span><span>بازی‌ها</span>
        </button>
        <button class="nav-item" onclick="switchTab('upgrades', this)">
            <span class="nav-icon">💎</span><span>ارتقا</span>
        </button>
        <button class="nav-item" onclick="switchTab('leaderboard', this)">
            <span class="nav-icon">🏆</span><span>رتبه‌بندی</span>
        </button>
    </div>

    <div class="modal" id="game-modal">
        <div class="modal-box">
            <button class="close-btn" onclick="closeGame()">✕</button>
            <div class="modal-title" id="game-title">بازی</div>
            <div class="stats-bar">
                <span>رکورد: <b id="game-high" style="color:var(--gold)">0</b></span>
                <span>امتیاز: <b id="game-score" style="color:var(--success)">0</b></span>
            </div>
            <div id="game-content"></div>
        </div>
    </div>

    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        const audioCtx = new AudioContext();

        function playSound(freq, type = 'sine', duration = 0.08) {
            try {
                if (audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }

        class Database {
            constructor() {
                this.key = 'GalacticTap_Engine_v4';
                this.defaultData = {
                    score: 0, level: 1, energy: 1000, maxEnergy: 1000,
                    tapPower: 1, autoTapper: 0, plays: 0, records: {},
                    upgrades: { multiTap: 1, energyLimit: 1, autoTap: 0, recharge: 1 }
                };
                this.data = JSON.parse(localStorage.getItem(this.key)) || this.defaultData;
                this.calculateOffline();
            }

            save() {
                localStorage.setItem(this.key, JSON.stringify(this.data));
                this.updateUI();
            }

            calculateOffline() {
                this.data.energy = this.data.maxEnergy;
            }

            addScore(amount) {
                this.data.score += amount;
                this.data.plays++;
                const exp = this.data.score;
                this.data.level = Math.floor(exp / 5000) + 1;
                this.save();
            }

            updateUI() {
                document.getElementById('balance-amount').innerText = this.format(this.data.score);
                document.getElementById('user-level').innerText = 'سطح ' + this.data.level;
                this.updateEnergy();
            }

            updateEnergy() {
                document.getElementById('energy-text').innerText = Math.floor(this.data.energy) + ' / ' + this.data.maxEnergy;
                document.getElementById('energy-fill').style.width = (this.data.energy / this.data.maxEnergy * 100) + '%';
            }

            format(n) {
                return n.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            }
        }

        const db = new Database();

        function toast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            playSound(800, 'triangle', 0.1);
            setTimeout(() => t.classList.remove('show'), 2500);
        }

        function switchTab(tab, el) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('screen-' + tab).classList.add('active');
            el.classList.add('active');
            playSound(500, 'sine', 0.05);
            if(tab === 'leaderboard') renderLB();
        }

        document.getElementById('tap-area').addEventListener('click', (e) => {
            if (db.data.energy <= 0) return toast('انرژی تمام شد!');
            const gain = db.data.tapPower * db.data.upgrades.multiTap;
            db.data.energy -= 1;
            db.addScore(gain);
            playSound(600 + Math.random() * 200, 'square', 0.05);
            
            const el = document.createElement('div');
            el.className = 'floating-text';
            el.innerText = '+' + gain;
            el.style.left = (e.clientX - 20) + 'px';
            el.style.top = (e.clientY - 40) + 'px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 800);
        });

        setInterval(() => {
            if (db.data.energy < db.data.maxEnergy) {
                db.data.energy += db.data.upgrades.recharge;
                if (db.data.energy > db.data.maxEnergy) db.data.energy = db.data.maxEnergy;
                db.updateEnergy();
            }
            if (db.data.upgrades.autoTap > 0) {
                db.addScore(db.data.upgrades.autoTap * 5);
            }
        }, 1000);

        const games = [
            { id: 'tapper', icon: '💥', name: 'ضربه‌زن', tag: 'Tap' },
            { id: 'memory', icon: '🧠', name: 'حافظه', tag: 'Brain' },
            { id: 'reaction', icon: '⚡', name: 'واکنش', tag: 'Speed' },
            { id: 'math', icon: '🧮', name: 'ریاضی', tag: 'Brain' },
            { id: 'target', icon: '🎯', name: 'هدف', tag: 'Aim' },
            { id: 'word', icon: '🔤', name: 'کلمه', tag: 'Word' },
            { id: 'wheel', icon: '🎡', name: 'شانس', tag: 'Casino' },
            { id: 'rps', icon: '✊', name: 'سنگ کاغذ', tag: 'Luck' },
            { id: 'higher', icon: '🃏', name: 'بالا/پایین', tag: 'Luck' },
            { id: 'color', icon: '🎨', name: 'تطبیق رنگ', tag: 'Brain' },
            { id: 'clicker', icon: '👆', name: 'کلیکر', tag: 'Speed' }
        ];

        document.getElementById('games-grid').innerHTML = games.map(g => `
            <div class="game-card" onclick="openGame('${g.id}')">
                <div class="game-icon">${g.icon}</div>
                <div class="game-name">${g.name}</div>
                <div class="game-tag">${g.tag}</div>
            </div>
        `).join('');

        const upgrades = [
            { id: 'multiTap', name: 'ضربه چندگانه', icon: '👆', desc: 'قدرت ضربه را ۲ برابر می‌کند', baseCost: 1000 },
            { id: 'energyLimit', name: 'مخزن انرژی', icon: '🔋', desc: '+500 به حداکثر انرژی', baseCost: 1500 },
            { id: 'autoTap', name: 'ربات خودکار', icon: '🤖', desc: '+5 سکه در ثانیه', baseCost: 3000 },
            { id: 'recharge', name: 'سرعت شارژ', icon: '⚡', desc: 'سرعت پر شدن انرژی', baseCost: 2500 }
        ];

        function renderUpgrades() {
            document.getElementById('upgrades-container').innerHTML = upgrades.map(u => {
                let lvl = db.data.upgrades[u.id];
                let cost = u.baseCost * Math.pow(1.5, lvl);
                let can = db.data.score >= cost;
                return `
                    <div class="game-card" style="flex-direction:row;justify-content:space-between;padding:15px;margin-bottom:12px;">
                        <div style="display:flex;align-items:center;gap:15px;">
                            <div style="font-size:30px;">${u.icon}</div>
                            <div style="text-align:right;">
                                <div class="game-name">${u.name} (سطح ${lvl})</div>
                                <div class="game-tag" style="margin-top:4px;">${u.desc}</div>
                            </div>
                        </div>
                        <button class="btn" style="width:auto;margin:0;padding:8px 12px;font-size:12px;${can ? '' : 'opacity:0.5;pointer-events:none;'}" onclick="buyUpgrade('${u.id}', ${cost})">
                            ${db.format(Math.floor(cost))} 🪙
                        </button>
                    </div>
                `;
            }).join('');
        }

        function buyUpgrade(id, cost) {
            if (db.data.score < cost) return;
            db.data.score -= cost;
            if (id === 'multiTap') db.data.upgrades.multiTap *= 2;
            if (id === 'energyLimit') { db.data.upgrades.energyLimit += 1; db.data.maxEnergy += 500; }
            if (id === 'autoTap') db.data.upgrades.autoTap += 1;
            if (id === 'recharge') db.data.upgrades.recharge *= 2;
            db.save();
            renderUpgrades();
            toast('ارتقا با موفقیت انجام شد!');
        }

        function renderLB() {
            const bots = [
                { name: 'NeonBlade', score: 982000 },
                { name: 'CryptoKing', score: 754000 },
                { name: 'GalacticLord', score: 1205000 },
                { name: 'GhostRider', score: 542000 },
                { name: 'CyberPunk', score: 310000 }
            ].sort((a,b) => b.score - a.score);
            
            document.getElementById('leaderboard-list').innerHTML = bots.map((b, i) => `
                <div class="game-card" style="flex-direction:row;justify-content:space-between;padding:15px;margin-bottom:10px;border-right:3px solid ${i===0?'var(--gold)':i===1?'#c0c0c0':'#cd7f32'};">
                    <span class="game-name">${i+1}. ${b.name}</span>
                    <span style="color:var(--success);font-family:Orbitron;">${db.format(b.score)}</span>
                </div>
            `).join('') + `
                <div class="game-card" style="flex-direction:row;justify-content:space-between;padding:15px;margin-bottom:10px;border-right:3px solid var(--primary);background:rgba(0,229,255,0.1);">
                    <span class="game-name">شما</span>
                    <span style="color:var(--primary);font-family:Orbitron;">${db.format(db.data.score)}</span>
                </div>
            `;
        }

        let loop = null;

        function openGame(id) {
            const modal = document.getElementById('game-modal');
            modal.classList.add('show');
            document.getElementById('game-title').innerText = games.find(g => g.id === id).name;
            document.getElementById('game-high').innerText = db.data.records[id] || 0;
            document.getElementById('game-score').innerText = '0';
            const c = document.getElementById('game-content');
            c.innerHTML = '';
            if (loop) clearInterval(loop);
            playSound(400, 'sine', 0.2);

            if (id === 'tapper') {
                c.innerHTML = `<div id="g-tap" style="width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(0,229,255,0.2),transparent);border:3px solid var(--primary);margin:20px auto;display:flex;justify-content:center;align-items:center;font-size:50px;cursor:pointer;">🌌</div>`;
                let score = 0;
                document.getElementById('g-tap').onclick = (e) => {
                    score++; db.addScore(1);
                    document.getElementById('game-score').innerText = score;
                    playSound(700, 'square', 0.05);
                };
            } else if (id === 'memory') {
                const emojis = ['🍎','🍌','🍇','🍉','🍓','🍒'];
                const cards = [...emojis, ...emojis].sort(() => Math.random() - 0.5);
                let html = '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:8px;">';
                cards.forEach((c, i) => { html += `<div id="m-${i}" class="game-card" style="height:60px;font-size:24px;" onclick="flipMem(${i},'${c}')"></div>`; });
                c.innerHTML = html + '</div>';
                let opened = [], matched = 0;
                window.flipMem = (i, e) => {
                    const el = document.getElementById(`m-${i}`);
                    if (el.innerText || opened.length === 2) return;
                    el.innerText = e; playSound(600, 'sine', 0.05);
                    opened.push({i, e});
                    if (opened.length === 2) {
                        if (opened[0].e === opened[1].e) {
                            matched++; db.addScore(20);
                            document.getElementById('game-score').innerText = matched * 20;
                            opened = [];
                            if (matched === 6) { toast('بردی!'); setTimeout(closeGame, 1500); }
                        } else {
                            setTimeout(() => { document.getElementById(`m-${opened[0].i}`).innerText=''; document.getElementById(`m-${opened[1].i}`).innerText=''; opened = []; }, 800);
                        }
                    }
                };
            } else if (id === 'reaction') {
                c.innerHTML = `<div id="r-box" style="width:100%;height:200px;border-radius:15px;display:flex;justify-content:center;align-items:center;font-size:20px;font-weight:bold;background:var(--secondary);cursor:pointer;">منتظر...</div>`;
                const box = document.getElementById('r-box');
                let start = 0;
                const timeout = setTimeout(() => { box.style.background = 'var(--success)'; box.innerText = 'کلیک!'; start = Date.now(); }, Math.random() * 3000 + 2000);
                box.onclick = () => {
                    if (!start) { box.innerText = 'زود زدی!'; box.style.background = 'var(--secondary)'; clearTimeout(timeout); }
                    else { const t = Date.now() - start; box.innerText = t + 'ms'; db.addScore(Math.floor(1000/t)*10); setTimeout(closeGame, 2000); }
                };
            } else if (id === 'math') {
                c.innerHTML = `<h1 id="m-q" style="font-size:36px;margin:20px 0;color:var(--primary);">? + ?</h1><input type="number" id="m-i" class="input-field" placeholder="؟"><button class="btn" onclick="checkM()">تایید</button>`;
                let ans = 0, score = 0;
                const newM = () => { const a = Math.floor(Math.random()*20)+1, b = Math.floor(Math.random()*20)+1, op = Math.random()>0.5?'+':'-'; ans = op==='+'?a+b:a-b; document.getElementById('m-q').innerText = `${a} ${op} ${b}`; };
                newM();
                window.checkM = () => {
                    if (parseInt(document.getElementById('m-i').value) === ans) { score+=10; db.addScore(10); document.getElementById('game-score').innerText=score; newM(); document.getElementById('m-i').value=''; }
                    else toast('اشتباه!');
                };
            } else if (id === 'target') {
                c.innerHTML = `<div style="font-weight:bold;color:var(--secondary);margin-bottom:10px;">زمان: <span id="t-t">15</span></div><div id="t-a" style="width:100%;height:220px;background:#000;border-radius:15px;position:relative;overflow:hidden;"></div>`;
                let time = 15, score = 0;
                const area = document.getElementById('t-a');
                const spawn = () => {
                    if (time <= 0) return;
                    const el = document.createElement('div');
                    el.innerText = '🎯'; el.style.position='absolute'; el.style.fontSize='30px'; el.style.left=Math.random()*80+'%'; el.style.top=Math.random()*80+'%';
                    el.onclick = () => { el.remove(); score+=10; db.addScore(10); document.getElementById('game-score').innerText=score; spawn(); };
                    area.appendChild(el);
                    setTimeout(() => { if(el.parentNode) el.remove(); }, 800);
                };
                spawn();
                loop = setInterval(() => { time--; document.getElementById('t-t').innerText=time; if(time<=0) { clearInterval(loop); closeGame(); } }, 1000);
            } else if (id === 'word') {
                const words = ['بازی', 'کتاب', 'مدرسه', 'ایران', 'دوست'];
                const target = words[Math.floor(Math.random()*words.length)];
                c.innerHTML = `<h2 style="font-size:30px;letter-spacing:5px;margin:20px 0;">${target.split('').sort(()=>Math.random()-0.5).join('')}</h2><input type="text" id="w-i" class="input-field" placeholder="کلمه..."><button class="btn" onclick="checkW('${target}')">تایید</button>`;
                window.checkW = (w) => { if(document.getElementById('w-i').value===w) { db.addScore(50); toast('درست! +50'); setTimeout(closeGame, 1000); } else toast('اشتباه!'); };
            } else if (id === 'wheel') {
                c.innerHTML = `<div style="font-size:80px;margin:20px 0;" id="w-v">🎡</div><button class="btn" onclick="spin()">چرخاندن (50)</button>`;
                window.spin = () => {
                    if (db.data.score < 50) return toast('سکه کم است!');
                    db.data.score -= 50; db.save();
                    document.getElementById('w-v').style.transform = `rotate(${Math.random()*720+720}deg)`;
                    setTimeout(() => { const w = Math.floor(Math.random()*200)+10; db.addScore(w); toast(`بردی! +${w}`); }, 1000);
                };
            } else if (id === 'rps') {
                c.innerHTML = `<div style="display:flex;gap:10px;justify-content:center;margin:20px 0;"><button class="btn" onclick="rps('✊')">✊</button><button class="btn" onclick="rps('✋')">✋</button><button class="btn" onclick="rps('✌️')">✌️</button></div><div id="r-m" style="font-weight:bold;font-size:18px;"></div>`;
                window.rps = (c) => {
                    const b = ['✊','✋','✌️'][Math.floor(Math.random()*3)];
                    const m = document.getElementById('r-m');
                    if(c===b) m.innerText = 'مساوی!';
                    else if((c==='✊'&&b==='✌️')||(c==='✋'&&b==='✊')||(c==='✌️'&&b==='✋')) { m.innerText = 'بردی!'; db.addScore(10); }
                    else m.innerText = 'باختی!';
                };
            } else if (id === 'higher') {
                c.innerHTML = `<h1 id="h-n" style="font-size:50px;margin:20px 0;">?</h1><button class="btn" onclick="guessH(true)">بالاتر</button><button class="btn" onclick="guessH(false)">پایین‌تر</button>`;
                let cur = Math.floor(Math.random()*100);
                document.getElementById('h-n').innerText = cur;
                window.guessH = (up) => {
                    const next = Math.floor(Math.random()*100);
                    if ((up && next > cur) || (!up && next < cur)) { db.addScore(10); toast('بردی!'); } else toast('باختی!');
                    cur = next; document.getElementById('h-n').innerText = cur;
                };
            } else if (id === 'color') {
                const colors = ['قرمز','آبی','سبز','زرد'];
                const cHex = { 'قرمز':'#ff0000', 'آبی':'#0000ff', 'سبز':'#00ff00', 'زرد':'#ffff00' };
                const word = colors[Math.floor(Math.random()*4)];
                const color = colors[Math.floor(Math.random()*4)];
                c.innerHTML = `<h1 style="font-size:40px;color:${cHex[color]};margin:20px 0;">${word}</h1><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;" id="c-g"></div>`;
                document.getElementById('c-g').innerHTML = colors.map(cl => `<button class="btn" style="border-color:${cHex[cl]};color:${cHex[cl]};" onclick="pickColor('${cl}','${color}')">${cl}</button>`).join('');
                window.pickColor = (picked, correct) => {
                    if (picked === correct) { db.addScore(15); toast('درست!'); setTimeout(() => openGame('color'), 500); }
                    else toast('اشتباه!');
                };
            } else if (id === 'clicker') {
                c.innerHTML = `<div id="c-t" style="font-size:60px;margin:20px 0;cursor:pointer;text-align:center;">🪙</div><div style="color:var(--secondary);font-weight:bold;">زمان: <span id="c-tt">10</span></div>`;
                let t = 10, s = 0;
                document.getElementById('c-t').onclick = () => { if(t>0) { s++; db.addScore(1); document.getElementById('game-score').innerText=s; } };
                loop = setInterval(() => { t--; document.getElementById('c-tt').innerText=t; if(t<=0) { clearInterval(loop); closeGame(); } }, 1000);
            }
        }

        function closeGame() {
            document.getElementById('game-modal').classList.remove('show');
            if (loop) clearInterval(loop);
        }

        const urlP = new URLSearchParams(window.location.search).get('game');
        if (urlP && games.some(g => g.id === urlP)) {
            setTimeout(() => openGame(urlP), 500);
        }

        db.updateUI();
        renderUpgrades();
    </script>
</body>
</html>
