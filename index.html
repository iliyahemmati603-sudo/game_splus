<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070d">
<title>Nexus Arcade</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="boot-screen">
    <div class="boot-logo">NEXUS</div>
    <div class="boot-spinner"></div>
</div>

<div id="app" class="app-hidden">
    <main id="screen-home" class="screen active">
        <header class="topbar">
            <div class="profile-mini">
                <div class="avatar" data-bind="avatar">?</div>
                <div class="user-meta">
                    <span class="u-name" data-bind="name">کاربر</span>
                    <span class="u-status">آنلاین</span>
                </div>
            </div>
            <div class="topbar-actions">
                <div class="coin-badge">💎 <span data-bind="coins">0</span></div>
            </div>
        </header>
        
        <div class="hero-section">
            <h1 class="hero-title">NEXUS ARCADE</h1>
            <p class="hero-subtitle">بهترین‌ها را اینجا تجربه کن</p>
        </div>

        <div class="category-slider" data-bind="categories"></div>

        <div class="list-header">
            <h2 data-bind="section-title">همه بازی‌ها</h2>
        </div>
        <div class="game-grid" data-bind="games"></div>
    </main>

    <section id="screen-lobby" class="screen">
        <header class="topbar">
            <button class="back-btn" data-nav="home">➔</button>
            <h2 class="screen-title" data-bind="lobby-title">بازی</h2>
            <div style="width:44px"></div>
        </header>
        <div class="lobby-hero">
            <div class="lobby-icon" data-bind="lobby-icon">🎮</div>
            <h2 data-bind="lobby-name">بازی</h2>
            <p data-bind="lobby-desc">توضیحات بازی</p>
        </div>
        <div class="lobby-actions">
            <button class="btn primary large" data-action="play">شروع بازی</button>
        </div>
    </section>

    <section id="screen-play" class="screen">
        <header class="topbar">
            <button class="back-btn" data-action="quit">➔</button>
            <h2 class="screen-title" data-bind="play-title">بازی</h2>
            <div style="width:44px"></div>
        </header>
        <div class="game-viewport" id="game-viewport">
            <canvas id="game-canvas"></canvas>
            <div class="game-hud" data-bind="hud"></div>
            <div class="game-overlay" id="game-overlay"></div>
        </div>
        <div class="game-controls-panel" id="game-controls"></div>
    </section>

    <section id="screen-settings" class="screen">
        <header class="topbar">
            <button class="back-btn" data-nav="home">➔</button>
            <h2 class="screen-title">تنظیمات پیشرفته</h2>
            <div style="width:44px"></div>
        </header>
        <div class="content-card">
            <h4 class="card-title">مشکل دارید؟</h4>
            <p style="font-size:13px; color:var(--text-muted); margin-bottom:15px; line-height:1.6;">
                اگر بازی‌ها لود نشدند یا تغییرات جدید را نمی‌بینید، روی دکمه زیر بزنید تا حافظه موقت (Cache) پاک شود و سایت مجدداً راه‌اندازی شود.
            </p>
            <button class="btn danger" data-action="force-update">🔄 پاک کردن کش و بروزرسانی</button>
        </div>
    </section>

    <nav class="bottom-nav">
        <button class="nav-item active" data-nav="home"><span class="nav-icon">🏠</span><span>خانه</span></button>
        <button class="nav-item" data-nav="settings"><span class="nav-icon">⚙️</span><span>تنظیمات</span></button>
    </nav>
</div>

<div id="toast-container"></div>
<script src="boot.js"></script>
</body>
</html>
