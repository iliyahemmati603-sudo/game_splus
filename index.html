<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Galactic Empire | Pro</title>
<script src="https://telegram.org/js/telegram-web-app.js" defer></script>
<style>
:root {
    --bg: #06070a;
    --panel: rgba(18, 22, 32, 0.95);
    --primary: #00e5ff;
    --secondary: #ff0055;
    --gold: #ffcc00;
    --success: #00ff88;
    --text: #e2e8f0;
    --muted: #64748b;
    --border: rgba(255,255,255,0.08);
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; outline: none; }
body { background: var(--bg); background-image: radial-gradient(circle at 50% 0%, #111827 0%, #06070a 80%); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; line-height: 1.5; }
.header { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: rgba(6,7,10,0.98); border-bottom: 1px solid var(--border); z-index: 100; flex-shrink: 0; }
.user-info { display: flex; align-items: center; gap: 10px; }
.avatar { width: 38px; height: 38px; border-radius: 10px; background: linear-gradient(135deg, var(--primary), var(--secondary)); display: flex; justify-content: center; align-items: center; font-weight: 900; font-size: 16px; color: #000; }
.user-name { font-size: 13px; font-weight: 700; }
.user-tag { font-size: 10px; color: var(--muted); }
.wallet { background: rgba(255,204,0,0.1); border: 1px solid rgba(255,204,0,0.3); padding: 6px 12px; border-radius: 10px; display: flex; align-items: center; gap: 5px; font-size: 14px; font-weight: 900; color: var(--gold); }
.main-content { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 80px; scrollbar-width: none; }
.main-content::-webkit-scrollbar { display: none; }
.tab-pane { display: none; animation: fadeIn 0.2s ease; }
.tab-pane.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
.section-title { font-size: 15px; font-weight: 900; margin-bottom: 15px; display: flex; align-items: center; gap: 8px; }
.section-title::before { content: ''; width: 4px; height: 16px; background: var(--secondary); border-radius: 2px; }
.home-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 50vh; }
.tap-circle { width: 180px; height: 180px; border-radius: 50%; background: radial-gradient(circle, rgba(0,229,255,0.15) 0%, transparent 70%); border: 3px solid rgba(0,229,255,0.4); box-shadow: 0 0 40px rgba(0,229,255,0.2); display: flex; justify-content: center; align-items: center; font-size: 80px; cursor: pointer; transition: transform 0.05s; position: relative; }
.tap-circle:active { transform: scale(0.92); border-color: var(--primary); }
.floating-text { position: absolute; font-size: 20px; font-weight: 900; color: #fff; text-shadow: 0 0 10px var(--primary); pointer-events: none; animation: floatUp 0.7s ease-out forwards; z-index: 50; }
@keyframes floatUp { 0% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(-60px) scale(1.3); } }
.energy-box { width: 90%; max-width: 320px; background: rgba(0,0,0,0.6); border: 1px solid var(--border); border-radius: 12px; padding: 10px; margin-top: 25px; }
.energy-header { display: flex; justify-content: space-between; font-size: 11px; font-weight: bold; margin-bottom: 5px; }
.energy-bar { width: 100%; height: 8px; background: #1a1a24; border-radius: 4px; overflow: hidden; }
.energy-fill { height: 100%; background: linear-gradient(90deg, #ffaa00, #ffdd00); width: 100%; transition: width 0.15s; }
.upg-btn { background: rgba(0,229,255,0.1); border: 1px solid var(--primary); color: var(--primary); padding: 12px; border-radius: 10px; margin-top: 15px; font-weight: bold; font-size: 13px; cursor: pointer; width: 90%; max-width: 320px; }
.games-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.game-card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 16px 12px; display: flex; flex-direction: column; align-items: center; text-align: center; cursor: pointer; transition: 0.2s; }
.game-card:active { transform: scale(0.95); border-color: var(--primary); }
.game-icon { font-size: 36px; margin-bottom: 8px; }
.game-title { font-size: 14px; font-weight: 900; margin-bottom: 4px; }
.game-desc { font-size: 10px; color: var(--muted); }
.bottom-nav { position: fixed; bottom: 0; width: 100%; height: 65px; background: rgba(6,7,10,0.98); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
.nav-btn { background: none; border: none; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 10px; font-weight: bold; cursor: pointer; padding: 8px 15px; border-radius: 12px; }
.nav-btn.active { color: var(--primary); background: rgba(0,229,255,0.1); }
.nav-icon { font-size: 20px; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.95); backdrop-filter: blur(8px); z-index: 2000; display: none; justify-content: center; align-items: center; padding: 16px; }
.modal.active { display: flex; }
.modal-box { background: var(--panel); border: 1px solid var(--primary); border-radius: 20px; width: 100%; max-width: 400px; padding: 20px; position: relative; max-height: 90vh; overflow-y: auto; }
.close-modal { position: absolute; top: 15px; right: 15px; background: rgba(255,0,85,0.1); border: none; color: var(--secondary); width: 28px; height: 28px; border-radius: 50%; font-size: 16px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
.modal-title { font-size: 18px; font-weight: 900; color: var(--primary); text-align: center; margin-bottom: 6px; }
.modal-desc { font-size: 11px; color: var(--muted); text-align: center; margin-bottom: 16px; }
.btn { width: 100%; padding: 12px; border: 2px solid var(--primary); background: transparent; color: var(--primary); border-radius: 10px; font-weight: 900; font-size: 14px; cursor: pointer; transition: 0.2s; margin-top: 8px; }
.btn:active { background: rgba(0,229,255,0.1); }
.btn-red { border-color: var(--secondary); color: var(--secondary); }
.btn-green { border-color: var(--success); color: var(--success); }
.btn-gold { border-color: var(--gold); color: var(--gold); }
.input-box { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: rgba(0,0,0,0.5); color: var(--text); font-size: 14px; margin-bottom: 8px; }
.guild-card { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
.guild-info h4 { font-size: 15px; font-weight: 900; color: var(--primary); margin-bottom: 4px; }
.guild-info p { font-size: 11px; color: var(--muted); }
.chat-container { display: flex; flex-direction: column; height: calc(100vh - 280px); background: var(--panel); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; margin-top: 12px; }
.chat-messages { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
.msg-bubble { max-width: 85%; padding: 8px 12px; border-radius: 12px; font-size: 12px; }
.msg-mine { align-self: flex-end; background: rgba(0,229,255,0.15); border: 1px solid var(--primary); border-bottom-right-radius: 2px; }
.msg-other { align-self: flex-start; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-bottom-left-radius: 2px; }
.msg-author { font-size: 9px; color: var(--gold); font-weight: bold; margin-bottom: 2px; display: block; }
.chat-input-area { padding: 8px; background: rgba(0,0,0,0.3); border-top: 1px solid var(--border); display: flex; gap: 6px; }
.chat-input { flex: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 8px; padding: 10px; color: var(--text); font-size: 12px; }
.chat-send { background: var(--primary); color: #000; border: none; border-radius: 8px; padding: 0 15px; font-weight: 900; cursor: pointer; }
.toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%) translateY(-100px); background: var(--panel); border: 2px solid var(--success); color: var(--success); padding: 10px 20px; border-radius: 10px; font-weight: 900; font-size: 13px; z-index: 5000; transition: transform 0.3s; }
.toast.show { transform: translateX(-50%) translateY(0); }
.game-visual { width: 100%; height: 200px; background: rgba(0,0,0,0.4); border-radius: 12px; border: 1px solid var(--border); position: relative; overflow: hidden; display: flex; justify-content: center; align-items: center; margin-bottom: 16px; }
.multiplier-text { font-size: 50px; font-weight: 900; color: var(--primary); text-shadow: 0 0 20px var(--primary); font-family: 'Courier New', Courier, monospace; }
.mine-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-bottom: 16px; }
.mine-cell { aspect-ratio: 1; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 8px; display: flex; justify-content: center; align-items: center; font-size: 20px; cursor: pointer; }
.mine-cell.diamond { background: rgba(0,255,136,0.15); border-color: var(--success); }
.mine-cell.bomb { background: rgba(255,0,85,0.2); border-color: var(--secondary); }
.stats-row { display: flex; justify-content: space-between; background: rgba(0,0,0,0.3); padding: 10px; border-radius: 8px; margin-bottom: 12px; font-size: 13px; }
.member-list { max-height: 150px; overflow-y: auto; margin-top: 10px; border: 1px solid var(--border); border-radius: 8px; background: rgba(0,0,0,0.2); }
.member-row { display: flex; justify-content: space-between; padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: 12px; }
.member-row:last-child { border-bottom: none; }
</style>
</head>
<body>

<div id="toast" class="toast"></div>

<div class="header">
<div class="user-info">
<div class="avatar" id="ui-avatar">G</div>
<div>
<div class="user-name" id="ui-name">در حال بارگذاری...</div>
<div class="user-tag" id="ui-tag">Galactic Pro</div>
</div>
</div>
<div class="wallet"><span>💎</span><span id="ui-coins">0</span></div>
</div>

<div class="main-content">

<div id="tab-home" class="tab-pane active">
<div class="home-screen">
<div class="tap-circle" id="tap-area">🌌</div>
<div class="energy-box">
<div class="energy-header"><span id="energy-text">1000 / 1000</span><span>⚡</span></div>
<div class="energy-bar"><div class="energy-fill" id="energy-fill"></div></div>
</div>
<button class="upg-btn" onclick="buyUpgrade()">ارتقای ضربه (هزینه: <span id="upg-cost">500</span>)</button>
</div>
</div>

<div id="tab-games" class="tab-pane">
<div class="section-title">بازی‌های حرفه‌ای</div>
<div class="games-grid">
<div class="game-card" onclick="openGame('crash')">
<div class="game-icon">📈</div>
<div class="game-title">Crash</div>
<div class="game-desc">قبل از سقوط خارج شو!</div>
</div>
<div class="game-card" onclick="openGame('mines')">
<div class="game-icon">💣</div>
<div class="game-title">Mines</div>
<div class="game-desc">الماس پیدا کن، ریسک کن!</div>
</div>
<div class="game-card" onclick="openGame('dice')">
<div class="game-icon">🎲</div>
<div class="game-title">Dice</div>
<div class="game-desc">تاس بریز و شرط ببند.</div>
</div>
<div class="game-card" onclick="openGame('ttt')">
<div class="game-icon">⭕</div>
<div class="game-title">PvP Duel</div>
<div class="game-desc">دوز در برابر ربات (شرطی).</div>
</div>
</div>
</div>

<div id="tab-guild" class="tab-pane">
<div class="section-title">اتحادیه</div>
<div id="guild-lobby">
<input type="text" id="guild-input" class="input-box" placeholder="نام اتحادیه...">
<button class="btn" onclick="createGuild()">ایجاد اتحادیه (1000 💎)</button>
<button class="btn btn-red" onclick="searchGuild()">جستجوی اتحادیه</button>
</div>
<div id="guild-room" style="display:none">
<div class="guild-card">
<div class="guild-info">
<h4 id="g-display-name"></h4>
<p>سطح: <span id="g-level">1</span> | خزانه: <span id="g-treasury" style="color:var(--gold)">0</span> 💎</p>
</div>
<button class="btn btn-red" style="width:auto;padding:6px 12px;margin:0" onclick="leaveGuild()">خروج</button>
</div>
<div class="stats-row">
<button class="btn btn-gold" style="margin:0;padding:8px" onclick="donateGuild()">کمک به خزانه (100)</button>
<button class="btn" style="margin:0;padding:8px" onclick="toggleMembers()">مشاهده اعضا</button>
</div>
<div class="member-list" id="member-list" style="display:none"></div>
<div class="chat-container">
<div class="chat-messages" id="guild-chat"></div>
<div class="chat-input-area">
<input type="text" id="guild-chat-input" class="chat-input" placeholder="پیام به اتحادیه..." onkeydown="if(event.key==='Enter')sendGuildMsg()">
<button class="chat-send" onclick="sendGuildMsg()">ارسال</button>
</div>
</div>
</div>
</div>

<div id="tab-profile" class="tab-pane">
<div class="section-title">پروفایل</div>
<div class="guild-card">
<div class="guild-info">
<h4 id="p-name">کاربر</h4>
<p>شناسه: <span id="p-id">0000</span></p>
</div>
</div>
<div class="stats-row"><span>سکه‌ها:</span><span id="p-coins" style="color:var(--gold)">0</span></div>
<div class="stats-row"><span>اتحادیه:</span><span id="p-guild" style="color:var(--primary)">ندارد</span></div>
</div>

</div>

<div class="bottom-nav">
<button class="nav-btn active" onclick="switchTab('home',this)"><span class="nav-icon">🏠</span>خانه</button>
<button class="nav-btn" onclick="switchTab('games',this)"><span class="nav-icon">🎮</span>بازی‌ها</button>
<button class="nav-btn" onclick="switchTab('guild',this)"><span class="nav-icon">🛡️</span>اتحادیه</button>
<button class="nav-btn" onclick="switchTab('profile',this)"><span class="nav-icon">👤</span>پروفایل</button>
</div>

<div class="modal" id="game-modal">
<div class="modal-box">
<button class="close-modal" onclick="closeGame()">×</button>
<div class="modal-title" id="m-title"></div>
<div class="modal-desc" id="m-desc"></div>
<div id="m-content"></div>
</div>
</div>

<script>
const DB_KEY = 'GalacticPro_V1';
const CHAT_CH = new BroadcastChannel('GalacticGuildChat');
let State = { coins: 1000, plays: 0, power: 1, energy: 1000, maxEnergy: 1000, guildId: null, userId: Math.floor(Math.random()*9000)+1000 };
let Guilds = JSON.parse(localStorage.getItem('GalacticGuilds')) || {
    "Alpha": { level: 1, treasury: 5000, leader: "Admin", members: ["Admin", "Bot1", "Bot2"] }
};
let GuildChat = {};
let gameInterval = null;

function save() {
    localStorage.setItem(DB_KEY, JSON.stringify(State));
    localStorage.setItem('GalacticGuilds', JSON.stringify(Guilds));
    updateUI();
}

function updateUI() {
    document.getElementById('ui-coins').innerText = State.coins.toLocaleString();
    document.getElementById('p-coins').innerText = State.coins.toLocaleString();
    document.getElementById('energy-text').innerText = Math.floor(State.energy) + ' / ' + State.maxEnergy;
    document.getElementById('energy-fill').style.width = (State.energy / State.maxEnergy * 100) + '%';
    document.getElementById('upg-cost').innerText = State.power * 500;
    document.getElementById('p-guild').innerText = State.guildId ? State.guildId : 'ندارد';
    
    if (State.guildId && Guilds[State.guildId]) {
        document.getElementById('g-display-name').innerText = State.guildId;
        document.getElementById('g-level').innerText = Guilds[State.guildId].level;
        document.getElementById('g-treasury').innerText = Guilds[State.guildId].treasury.toLocaleString();
    }
}

function toast(msg) {
    const t = document.getElementById('toast');
    t.innerText = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
}

function init() {
    try {
        const tg = window.Telegram?.WebApp;
        if (tg && tg.initDataUnsafe?.user) {
            const u = tg.initDataUnsafe.user;
            document.getElementById('ui-name').innerText = u.first_name;
            document.getElementById('ui-avatar').innerText = u.first_name[0].toUpperCase();
            document.getElementById('p-name').innerText = u.first_name;
            document.getElementById('p-id').innerText = u.id;
            if(u.username) document.getElementById('ui-tag').innerText = '@' + u.username;
            tg.ready(); tg.expand();
        } else {
            document.getElementById('ui-name').innerText = 'کاربر تستی';
        }
    } catch(e) {}
    
    if (State.guildId && Guilds[State.guildId]) {
        document.getElementById('guild-lobby').style.display = 'none';
        document.getElementById('guild-room').style.display = 'block';
    }
    updateUI();
}

function switchTab(id, btn) {
    document.querySelectorAll('.tab-pane').forEach(e => e.classList.remove('active'));
    document.querySelectorAll('.nav-btn').forEach(e => e.classList.remove('active'));
    document.getElementById('tab-' + id).classList.add('active');
    btn.classList.add('active');
    if (id === 'guild') renderGuildChat();
}

document.getElementById('tap-area').addEventListener('click', (e) => {
    if (State.energy <= 0) return toast('انرژی تمام شد!');
    State.energy -= 1;
    State.coins += State.power;
    save();
    const el = document.createElement('div');
    el.className = 'floating-text';
    el.innerText = '+' + State.power;
    el.style.left = (e.clientX - 10) + 'px';
    el.style.top = (e.clientY - 20) + 'px';
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 700);
});

setInterval(() => {
    if (State.energy < State.maxEnergy) {
        State.energy = Math.min(State.maxEnergy, State.energy + 5);
        document.getElementById('energy-text').innerText = Math.floor(State.energy) + ' / ' + State.maxEnergy;
        document.getElementById('energy-fill').style.width = (State.energy / State.maxEnergy * 100) + '%';
    }
}, 1000);

function buyUpgrade() {
    const cost = State.power * 500;
    if (State.coins >= cost) {
        State.coins -= cost;
        State.power += 1;
        save();
        toast('ضربه ارتقا یافت!');
    } else toast('سکه کافی نیست!');
}

function openGame(type) {
    document.getElementById('game-modal').classList.add('active');
    const c = document.getElementById('m-content');
    const title = document.getElementById('m-title');
    const desc = document.getElementById('m-desc');
    c.innerHTML = '';
    if (gameInterval) clearInterval(gameInterval);

    if (type === 'crash') {
        title.innerText = '📈 Crypto Crash';
        desc.innerText = 'ضریب بالا می‌رود. قبل از سقوط خارج شوید!';
        setupCrash(c);
    } else if (type === 'mines') {
        title.innerText = '💣 Mines';
        desc.innerText = 'الماس پیدا کنید. هر الماس ضریب را بالا می‌برد.';
        setupMines(c);
    } else if (type === 'dice') {
        title.innerText = '🎲 Dice';
        desc.innerText = 'حدس بزنید عدد بالاتر یا پایین‌تر از هدف است.';
        setupDice(c);
    } else if (type === 'ttt') {
        title.innerText = '⭕ PvP Duel';
        desc.innerText = 'دوز در برابر ربات با شرط سکه.';
        setupTTT(c);
    }
}

function closeGame() {
    document.getElementById('game-modal').classList.remove('active');
    if (gameInterval) clearInterval(gameInterval);
    State.plays++;
    save();
}

function setupCrash(c) {
    c.innerHTML = `
    <div class="game-visual"><div class="multiplier-text" id="crash-mult">1.00x</div></div>
    <div class="stats-row"><span>شرط:</span><span id="bet-val">100</span></div>
    <button class="btn btn-green" id="cashout-btn" style="display:none" onclick="cashOut()">خروج (Cashout)</button>
    <button class="btn" id="start-crash" onclick="startCrash()">شروع با 100 سکه</button>
    <div id="crash-msg" style="text-align:center; margin-top:10px; font-weight:bold;"></div>`;
}

let crashMult = 1.0;
let isCrashed = false;
let isPlaying = false;

window.startCrash = function() {
    if (State.coins < 100) return toast('سکه کافی نیست!');
    State.coins -= 100; save();
    crashMult = 1.0; isCrashed = false; isPlaying = true;
    document.getElementById('start-crash').style.display = 'none';
    document.getElementById('cashout-btn').style.display = 'block';
    document.getElementById('crash-msg').innerText = '';
    
    const crashPoint = Math.max(1.01, 0.99 / Math.random());
    
    gameInterval = setInterval(() => {
        if (isCrashed) return;
        crashMult += 0.05 * crashMult;
        document.getElementById('crash-mult').innerText = crashMult.toFixed(2) + 'x';
        
        if (crashMult >= crashPoint) {
            isCrashed = true;
            clearInterval(gameInterval);
            document.getElementById('crash-mult').innerText = 'CRASHED!';
            document.getElementById('crash-mult').style.color = 'var(--secondary)';
            document.getElementById('cashout-btn').style.display = 'none';
            document.getElementById('start-crash').style.display = 'block';
            document.getElementById('crash-msg').innerText = 'باختی!';
            document.getElementById('crash-msg').style.color = 'var(--secondary)';
            isPlaying = false;
        }
    }, 100);
};

window.cashOut = function() {
    if (!isPlaying || isCrashed) return;
    isPlaying = false;
    clearInterval(gameInterval);
    const win = Math.floor(100 * crashMult);
    State.coins += win; save();
    document.getElementById('cashout-btn').style.display = 'none';
    document.getElementById('start-crash').style.display = 'block';
    document.getElementById('crash-msg').innerText = 'بردی! +' + win + ' سکه';
    document.getElementById('crash-msg').style.color = 'var(--success)';
    document.getElementById('crash-mult').style.color = 'var(--success)';
};

function setupMines(c) {
    c.innerHTML = `
    <div class="stats-row"><span>ضریب:</span><span id="mine-mult" style="color:var(--gold)">1.00x</span></div>
    <div class="mine-grid" id="mine-grid"></div>
    <button class="btn btn-green" id="mine-cashout" onclick="minesCashOut()" disabled>خروج و برداشت</button>
    <button class="btn" id="mine-start" onclick="startMines()">شروع (100 سکه)</button>`;
}

let mineMult = 1.0;
let mineBombs = [];
let mineRevealed = 0;
let mineActive = false;

window.startMines = function() {
    if (State.coins < 100) return toast('سکه کافی نیست!');
    State.coins -= 100; save();
    mineMult = 1.0; mineRevealed = 0; mineActive = true;
    mineBombs = [];
    while(mineBombs.length < 3) {
        let r = Math.floor(Math.random() * 25);
        if (!mineBombs.includes(r)) mineBombs.push(r);
    }
    
    document.getElementById('mine-start').style.display = 'none';
    document.getElementById('mine-cashout').disabled = false;
    document.getElementById('mine-mult').innerText = '1.00x';
    
    const grid = document.getElementById('mine-grid');
    grid.innerHTML = '';
    for (let i = 0; i < 25; i++) {
        const cell = document.createElement('div');
        cell.className = 'mine-cell';
        cell.onclick = () => {
            if (!mineActive || cell.classList.contains('diamond') || cell.classList.contains('bomb')) return;
            if (mineBombs.includes(i)) {
                cell.classList.add('bomb'); cell.innerText = '💥';
                mineActive = false;
                document.getElementById('mine-cashout').disabled = true;
                document.getElementById('mine-start').style.display = 'block';
                toast('باختی!');
            } else {
                cell.classList.add('diamond'); cell.innerText = '💎';
                mineRevealed++;
                mineMult = 1 + (mineRevealed * 0.2);
                document.getElementById('mine-mult').innerText = mineMult.toFixed(2) + 'x';
            }
        };
        grid.appendChild(cell);
    }
};

window.minesCashOut = function() {
    if (!mineActive) return;
    mineActive = false;
    const win = Math.floor(100 * mineMult);
    State.coins += win; save();
    document.getElementById('mine-start').style.display = 'block';
    document.getElementById('mine-cashout').disabled = true;
    toast('بردی! +' + win + ' سکه');
};

function setupDice(c) {
    c.innerHTML = `
    <div class="game-visual" style="flex-direction:column">
        <div style="font-size:40px" id="dice-visual">🎲</div>
        <div style="font-size:14px; margin-top:10px">عدد رول شده: <span id="dice-roll" style="font-weight:bold;color:var(--gold)">-</span></div>
    </div>
    <div class="stats-row"><span>شرط:</span><span>100 سکه</span></div>
    <div style="display:flex; gap:10px; margin-bottom:16px">
        <button class="btn btn-green" onclick="playDice('over')">بالاتر از 50</button>
        <button class="btn btn-red" onclick="playDice('under')">پایین‌تر از 50</button>
    </div>
    <div id="dice-msg" style="text-align:center; font-weight:bold; min-height:20px"></div>`;
}

window.playDice = function(type) {
    if (State.coins < 100) return toast('سکه کافی نیست!');
    State.coins -= 100; save();
    const roll = Math.floor(Math.random() * 100) + 1;
    document.getElementById('dice-visual').innerText = '🎲';
    document.getElementById('dice-roll').innerText = roll;
    
    setTimeout(() => {
        if ((type === 'over' && roll > 50) || (type === 'under' && roll < 50)) {
            State.coins += 198; save();
            document.getElementById('dice-msg').innerText = 'بردی! +198 سکه';
            document.getElementById('dice-msg').style.color = 'var(--success)';
        } else {
            document.getElementById('dice-msg').innerText = 'باختی!';
            document.getElementById('dice-msg').style.color = 'var(--secondary)';
        }
    }, 500);
};

function setupTTT(c) {
    c.innerHTML = `
    <div class="stats-row"><span>شرط:</span><span>50 سکه</span></div>
    <div id="ttt-board" style="display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:16px"></div>
    <div id="ttt-status" style="text-align:center; font-weight:bold; color:var(--primary)">نوبت شما (X)</div>
    <button class="btn btn-red" onclick="closeGame()">انصراف</button>`;
    startTTT();
}

let tttBoard = [];
let tttActive = false;

function startTTT() {
    tttBoard = ['','','','','','','','',''];
    tttActive = true;
    document.getElementById('ttt-status').innerText = 'نوبت شما (X)';
    renderTTT();
}

function renderTTT() {
    const b = document.getElementById('ttt-board');
    b.innerHTML = '';
    tttBoard.forEach((v, i) => {
        const cell = document.createElement('div');
        cell.style.cssText = 'aspect-ratio:1; background:rgba(255,255,255,0.05); border:1px solid var(--border); border-radius:8px; display:flex; justify-content:center; align-items:center; font-size:28px; font-weight:bold; cursor:pointer;';
        cell.innerText = v;
        cell.style.color = v === 'X' ? 'var(--primary)' : 'var(--secondary)';
        cell.onclick = () => playTTT(i);
        b.appendChild(cell);
    });
}

function playTTT(i) {
    if (!tttActive || tttBoard[i]) return;
    tttBoard[i] = 'X';
    renderTTT();
    if (checkTTT('X')) return;
    if (!tttBoard.includes('')) return finishTTT('draw');
    setTimeout(() => {
        let empty = tttBoard.map((v, idx) => v === '' ? idx : null).filter(v => v !== null);
        let move = empty[Math.floor(Math.random() * empty.length)];
        tttBoard[move] = 'O';
        renderTTT();
        if (checkTTT('O')) return;
        if (!tttBoard.includes('')) return finishTTT('draw');
    }, 300);
}

function checkTTT(p) {
    const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    for (let w of wins) {
        if (tttBoard[w[0]] === p && tttBoard[w[1]] === p && tttBoard[w[2]] === p) {
            finishTTT(p);
            return true;
        }
    }
    return false;
}

function finishTTT(res) {
    tttActive = false;
    const st = document.getElementById('ttt-status');
    if (res === 'X') {
        st.innerText = 'شما بردید! +100 سکه';
        st.style.color = 'var(--success)';
        State.coins += 100;
    } else if (res === 'O') {
        st.innerText = 'ربات برد! -50 سکه';
        st.style.color = 'var(--secondary)';
        State.coins -= 50;
    } else {
        st.innerText = 'مساوی!';
        st.style.color = 'var(--muted)';
    }
    save();
    setTimeout(startTTT, 2000);
}

function createGuild() {
    const name = document.getElementById('guild-input').value.trim();
    if (!name) return toast('نام را وارد کنید');
    if (State.coins < 1000) return toast('1000 سکه نیاز است');
    if (Guilds[name]) return toast('این نام وجود دارد');
    State.coins -= 1000;
    Guilds[name] = { level: 1, treasury: 0, leader: State.userId, members: [State.userId] };
    State.guildId = name;
    save();
    document.getElementById('guild-lobby').style.display = 'none';
    document.getElementById('guild-room').style.display = 'block';
    toast('اتحادیه ساخته شد!');
}

function searchGuild() {
    const name = document.getElementById('guild-input').value.trim();
    if (!name) return toast('نام را وارد کنید');
    if (!Guilds[name]) return toast('پیدا نشد');
    State.guildId = name;
    if (!Guilds[name].members.includes(State.userId)) Guilds[name].members.push(State.userId);
    save();
    document.getElementById('guild-lobby').style.display = 'none';
    document.getElementById('guild-room').style.display = 'block';
    toast('به اتحادیه پیوستید!');
}

function leaveGuild() {
    State.guildId = null;
    save();
    document.getElementById('guild-lobby').style.display = 'block';
    document.getElementById('guild-room').style.display = 'none';
}

function donateGuild() {
    if (!State.guildId) return;
    if (State.coins < 100) return toast('سکه کافی نیست');
    State.coins -= 100;
    Guilds[State.guildId].treasury += 100;
    save();
    toast('100 سکه به خزانه اضافه شد!');
}

function toggleMembers() {
    const el = document.getElementById('member-list');
    if (el.style.display === 'none') {
        el.style.display = 'block';
        el.innerHTML = Guilds[State.guildId].members.map(m => `<div class="member-row"><span>User ${m}</span><span>${m === Guilds[State.guildId].leader ? '👑 رهبر' : 'عضو'}</span></div>`).join('');
    } else {
        el.style.display = 'none';
    }
}

function renderGuildChat() {
    const box = document.getElementById('guild-chat');
    if (!box || !State.guildId) return;
    const msgs = GuildChat[State.guildId] || [];
    box.innerHTML = msgs.map(m => `
        <div class="msg-bubble ${m.mine ? 'msg-mine' : 'msg-other'}">
            <span class="msg-author">${m.author}</span>
            <div>${m.text}</div>
        </div>
    `).join('');
    box.scrollTop = box.scrollHeight;
}

function sendGuildMsg() {
    const input = document.getElementById('guild-chat-input');
    const text = input.value.trim();
    if (!text || !State.guildId) return;
    const msg = { author: State.userId, text: text, mine: true, ts: Date.now(), guild: State.guildId };
    if (!GuildChat[State.guildId]) GuildChat[State.guildId] = [];
    GuildChat[State.guildId].push(msg);
    input.value = '';
    renderGuildChat();
    CHAT_CH.postMessage(msg);
}

CHAT_CH.onmessage = (e) => {
    const msg = e.data;
    if (!msg || msg.author === State.userId || msg.guild !== State.guildId) return;
    if (!GuildChat[State.guildId]) GuildChat[State.guildId] = [];
    GuildChat[State.guildId].push({...msg, mine: false});
    if (document.getElementById('tab-guild').classList.contains('active')) renderGuildChat();
};

window.addEventListener('load', () => {
    init();
    const saved = localStorage.getItem(DB_KEY);
    if (saved) State = JSON.parse(saved);
    updateUI();
});
</script>
</body>
</html>
